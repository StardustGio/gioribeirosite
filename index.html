  width:min(700px,50vw); margin-inline:auto}
.capa-flor{width:clamp(110px,15vw,168px); color:var(--ac); margin-bottom:26px}
.capa h1{font-size:clamp(50px,10.5vw,124px); letter-spacing:-.035em; margin-bottom:10px}
.capa-cargo{
  font-family:Quicksand,sans-serif; font-weight:600; letter-spacing:.38em;
  font-size:clamp(13px,1.5vw,17px); color:var(--ac); margin-bottom:28px; padding-left:.38em;
}
.capa-frase{font-size:clamp(17px,2vw,21px); color:var(--suave); max-width:46ch; margin-bottom:0}
.capa-cta{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:34px}
.capa-dica{font-size:14px; color:var(--suave); margin:20px 0 0; opacity:.75}

/* animação de abertura */
.anim-flor{transform-origin:50% 50%; animation:desabrochar 1.3s cubic-bezier(.22,1,.36,1) both}
@keyframes desabrochar{
  0%{transform:scale(.25) rotate(-50deg); opacity:0}
  100%{transform:scale(1) rotate(0); opacity:1}
}
.subir{opacity:0; transform:translateY(24px); animation:subir .85s cubic-bezier(.22,1,.36,1) both}
.subir.d1{animation-delay:.18s} .subir.d2{animation-delay:.30s}
.subir.d3{animation-delay:.42s} .subir.d4{animation-delay:.54s}
@keyframes subir{to{opacity:1; transform:none}}

/* ---- Adesivos do hero -------------------------------------------------- */
.capa-ades{position:absolute; inset:0; z-index:4; pointer-events:none}
.ades-faixa{position:absolute; top:0; bottom:0; width:clamp(132px,23vw,320px)}
.ades-faixa.esq{left:0} .ades-faixa.dir{right:0}
.ades{
  position:absolute; left:var(--x); top:var(--y);
  width:calc(var(--tam) * var(--esc,1));
  transform:translate(var(--dx,0px), var(--dy,0px));
  cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none;
  pointer-events:auto;
}
.ades.arrastando{cursor:grabbing; z-index:9}
.ades-ent{animation:adesEntra .9s cubic-bezier(.34,1.3,.5,1) var(--atraso) both}
.ades-flt{animation:adesFlutua var(--dur) ease-in-out infinite; animation-delay:calc(var(--atraso) + .9s)}
.ades svg{
  width:100%; height:auto; display:block; transform:rotate(var(--rot));
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.16)) drop-shadow(0 14px 26px rgba(0,0,0,.20)); transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
.ades:hover svg{transform:rotate(0deg) scale(1.09)}
.ades.arrastando svg{transform:rotate(0deg) scale(1.14); filter:drop-shadow(0 20px 34px rgba(0,0,0,.30))}
@keyframes adesEntra{from{opacity:0; transform:scale(.2) rotate(-40deg)} to{opacity:1; transform:none}}
@keyframes adesFlutua{0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)}}

/* ---- Fita das áreas ---------------------------------------------------- */
.fita{
  position:absolute; left:0; right:0; bottom:0; z-index:3; overflow:hidden;
  padding:16px 0; border-top:1px solid color-mix(in srgb,var(--tinta) 14%,transparent);
  background:color-mix(in srgb,var(--base) 70%,transparent); backdrop-filter:blur(6px);
}
.fita-fila{display:flex; align-items:center; gap:30px; width:max-content; animation:desliza 38s linear infinite}
.fita-fila span{
  font-family:Quicksand,sans-serif; font-weight:600; font-size:16px;
  letter-spacing:.12em; white-space:nowrap;
}
.fita-flor{width:24px; height:24px; color:var(--ac); flex:none}
@keyframes desliza{to{transform:translateX(-50%)}}

/* ---- Seções ----------------------------------------------------------- */
section{padding:96px 0; position:relative}
.secao-titulo{font-size:clamp(30px,5vw,54px); letter-spacing:-.02em; margin-bottom:14px}
.secao-linha{
  height:2px; width:0; background:var(--ac); margin-bottom:38px;
  transition:width 1s cubic-bezier(.22,1,.36,1);
}
.revelado .secao-linha{width:110px}

.reveal{opacity:0; transform:translateY(26px); transition:opacity .75s ease, transform .75s cubic-bezier(.22,1,.36,1)}
.reveal.revelado{opacity:1; transform:none}

/* ---- Sobre ------------------------------------------------------------ */
.sobre-grade{display:grid; grid-template-columns:.85fr 1.15fr; gap:56px; align-items:start}
.sobre-foto{
  aspect-ratio:4/5; border-radius:var(--raio); overflow:hidden; position:relative;
  background:var(--sup); display:grid; place-items:center;
}
.sobre-foto img{width:100%; height:100%; object-fit:cover}
.sobre-foto .flor-fundo{width:55%; color:var(--ac); opacity:.5}
.servicos{list-style:none; padding:0; margin:26px 0 0; display:grid; gap:2px}
.servicos li{
  padding:13px 0; border-top:1px solid color-mix(in srgb,var(--tinta) 16%,transparent);
  font-family:Quicksand,sans-serif; font-weight:600;
}

/* ---- Filtros e grade de trabalhos ------------------------------------- */
.filtros{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:38px}
.chip{
  padding:9px 17px; border-radius:999px; font-size:14.5px; font-weight:700;
  font-family:Quicksand,sans-serif;
  border:2px solid color-mix(in srgb,var(--tinta) 22%,transparent);
  transition:background .25s, border-color .25s, color .25s;
}
.chip[aria-pressed="true"]{background:var(--ac); border-color:var(--ac); color:var(--sobre-ac)}
.chip small{display:block; font-size:11px; font-weight:500; opacity:.7; letter-spacing:.06em}

.grade{display:grid; grid-template-columns:repeat(2,1fr); gap:26px}
.cartao{
  grid-column:span 1; text-decoration:none; display:block; position:relative;
  border-radius:var(--raio); overflow:hidden; background:var(--sup);
  transition:transform .45s cubic-bezier(.22,1,.36,1);
}
.cartao.largo{grid-column:span 2}
.cartao:hover{transform:translateY(-6px)}
.cartao-img{
  aspect-ratio:16/11; position:relative; overflow:hidden; background:var(--sup);
  display:grid; place-items:center;
}
.cartao.largo .cartao-img{aspect-ratio:21/9}
.cartao-img img{width:100%; height:100%; object-fit:cover; transition:transform .7s cubic-bezier(.22,1,.36,1)}
.cartao:hover .cartao-img img{transform:scale(1.05)}
.cartao-img .flor-fundo{width:26%; color:var(--ac); opacity:.55; position:relative}
.cartao-txt{padding:20px 22px 24px}
.cartao-txt h3{font-size:22px; margin-bottom:4px}
.cartao-txt p{font-size:15px; color:var(--suave); margin:0}
.cartao-meta{
  display:flex; gap:10px; align-items:center; margin-bottom:9px;
  font-size:12.5px; letter-spacing:.12em; color:var(--ac); font-weight:700;
}
.vazio{padding:50px 0; color:var(--suave)}

/* ---- Página de projeto ------------------------------------------------ */
.proj-topo{padding:130px 0 40px}
.proj-titulo{font-size:clamp(36px,7vw,78px); letter-spacing:-.025em; margin:10px 0 18px}
.proj-fichas{display:flex; flex-wrap:wrap; gap:30px 34px; margin:34px 0 40px; padding-top:22px;
  border-top:1px solid color-mix(in srgb,var(--tinta) 16%,transparent)}
.ficha span{display:block; font-size:12.5px; letter-spacing:.12em; color:var(--ac); font-weight:700; margin-bottom:3px}
.ficha strong{font-family:Quicksand,sans-serif; font-weight:600; font-size:17px}
.proj-texto{max-width:var(--medida); font-size:18px}
.proj-galeria{display:grid; gap:20px; margin-top:52px}
.proj-galeria img{width:100%; border-radius:var(--raio)}
.proj-galeria .vago{
  aspect-ratio:16/9; border-radius:var(--raio); background:var(--sup);
  display:grid; place-items:center; color:var(--suave); font-size:15px; text-align:center; padding:20px;
}
.voltar{display:inline-flex; align-items:center; gap:9px; text-decoration:none; font-weight:700;
  font-family:Quicksand,sans-serif; color:var(--ac)}

/* ---- Contato ---------------------------------------------------------- */
.contato-mail{
  font-family:Quicksand,sans-serif; font-weight:700; letter-spacing:-.02em;
  font-size:clamp(24px,5.5vw,58px); text-decoration:none; display:inline-block;
  word-break:break-word;
}
.contato-mail:hover{color:var(--ac)}
.redes{display:flex; flex-wrap:wrap; gap:12px; margin-top:34px}

.rodape{
  padding:36px 0; border-top:1px solid color-mix(in srgb,var(--tinta) 14%,transparent);
  display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:center;
  font-size:14px; color:var(--suave);
}

/* ---- Faixas de cor por seção ------------------------------------------- */
/* Cada faixa redefine os mesmos tokens do tema, então todo componente que já  */
/* usa var(--tinta), var(--ac) etc. se adapta sozinho, sem CSS duplicado.      */
.tom{
  padding:108px 0; color:var(--tinta); background:var(--base);
  transition:background .5s ease, color .5s ease;
}
.tom-a{
  --base:var(--a-base); --sup:var(--a-sup); --tinta:var(--a-tinta);
  --suave:var(--a-suave); --ac:var(--a-ac); --sobre-ac:var(--a-sobre);
}
.tom-b{
  --base:var(--b-base); --sup:var(--b-sup); --tinta:var(--b-tinta);
  --suave:var(--b-suave); --ac:var(--b-ac); --sobre-ac:var(--b-sobre);
}

/* ---- Case: blocos numerados -------------------------------------------- */
.proj-resumo{font-size:clamp(19px,2.3vw,25px); color:var(--suave); max-width:36ch; margin-bottom:0}
.metricas{
  display:flex; flex-wrap:wrap; gap:14px; margin:0 0 54px;
}
.metricas > div{
  background:var(--sup); border-radius:var(--raio); padding:20px 26px; min-width:150px;
  border:1px solid color-mix(in srgb,var(--tinta) 10%,transparent);
}
.metricas strong{
  display:block; font-family:Quicksand,sans-serif; font-weight:700;
  font-size:clamp(24px,3vw,34px); letter-spacing:-.02em; color:var(--ac); line-height:1.1;
}
.metricas span{font-size:14px; color:var(--suave)}

.blocos{display:grid; gap:70px}
.bloco{display:grid; grid-template-columns:230px 1fr; gap:40px; align-items:start}
.bloco-cab{position:sticky; top:104px}
.bloco-num{
  display:block; font-family:Quicksand,sans-serif; font-weight:700; font-size:15px;
  letter-spacing:.14em; color:var(--ac); margin-bottom:8px;
}
.bloco-cab h2{font-size:clamp(22px,2.6vw,30px); letter-spacing:-.02em}
.bloco-corpo p{font-size:17.5px}
.bloco-lista{margin:4px 0 0; padding-left:20px; max-width:var(--medida)}
.bloco-lista li{margin-bottom:9px; font-size:17px}
.bloco-lista li::marker{color:var(--ac)}
.bloco-imgs{display:grid; gap:18px; margin-top:28px}
.bloco-imgs img{width:100%; border-radius:var(--raio)}

.aprendi{margin-top:90px}
.aprendi ul{margin:0; padding-left:20px; max-width:var(--medida)}
.aprendi li{margin-bottom:12px; font-size:17.5px}
.aprendi li::marker{color:var(--ac)}

.proximo{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:14px;
  padding:54px 0 10px; border-bottom:1px solid color-mix(in srgb,var(--tinta) 14%,transparent);
}
.proximo span{font-size:13px; letter-spacing:.14em; color:var(--suave); font-weight:700}
.proximo a{
  font-family:Quicksand,sans-serif; font-weight:700; text-decoration:none;
  font-size:clamp(24px,4vw,40px); letter-spacing:-.02em; transition:color .25s;
}
.proximo a:hover{color:var(--ac)}

/* ---- Galeria: grade de 6 colunas, formato por imagem -------------------- */
.galeria{display:grid; grid-template-columns:repeat(6,1fr); gap:20px; margin-top:30px; align-items:start}
.gal-item{margin:0; display:grid; gap:9px; grid-column:span 6}
.gal-item img{
  width:100%; border-radius:var(--raio); cursor:zoom-in; display:block;
  background:var(--sup); transition:transform .4s cubic-bezier(.22,1,.36,1);
}
.gal-item img:hover{transform:scale(1.012)}
.gal-item figcaption{font-size:14px; color:var(--suave); line-height:1.5}

.gal-item.f-dupla{grid-column:span 3}
.gal-item.f-tripla{grid-column:span 2}
.gal-item.f-retrato{grid-column:span 2}
.gal-item.f-dupla img{aspect-ratio:4/3; object-fit:cover}
.gal-item.f-tripla img{aspect-ratio:1/1; object-fit:cover}
.gal-item.f-retrato img{aspect-ratio:9/17; object-fit:cover}
.gal-item.f-sangria{width:100vw; margin-left:calc(50% - 50vw)}
.gal-item.f-sangria img{border-radius:0}
.gal-item.f-sangria figcaption{width:min(1180px,92vw); margin-inline:auto}

/* ---- Lupa --------------------------------------------------------------- */
/* o atributo hidden precisa vencer o display da classe, senão a lupa nasce aberta */
.lupa{display:none}
.lupa:not([hidden]){
  position:fixed; inset:0; z-index:120; display:grid; place-items:center;
  background:color-mix(in srgb,#070707 88%, transparent); padding:70px 4vw;
  animation:aparece .25s ease both;
}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.lupa-quadro{margin:0; display:grid; gap:12px; justify-items:center; pointer-events:none}
.lupa-quadro img{
  max-width:min(1200px,92vw); max-height:78svh; width:auto; object-fit:contain;
  border-radius:10px; box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.lupa-quadro figcaption{color:#f2f2f2; font-size:15px; text-align:center; max-width:60ch}
.lupa-btn{
  position:absolute; width:52px; height:52px; border-radius:50%;
  background:#f2f2f2; color:#070707; font-size:30px; line-height:1;
  display:grid; place-items:center; transition:transform .25s;
}
.lupa-btn[hidden]{display:none}
.lupa-btn:hover{transform:scale(1.1)}
.lupa-fechar{top:22px; right:4vw; font-size:26px}
.lupa-ant{left:4vw; top:50%; margin-top:-26px}
.lupa-prox{right:4vw; top:50%; margin-top:-26px}

/* ---- Contato ----------------------------------------------------------- */
.contato-grade{display:grid; grid-template-columns:1.2fr .8fr; gap:56px; margin-top:38px; align-items:start}
.campo{display:grid; gap:7px; margin:0 0 18px; max-width:none}
.campo label{font-family:Quicksand,sans-serif; font-weight:600; font-size:14.5px}
.campo input,.campo textarea{
  font:inherit; font-size:16px; color:var(--tinta); background:var(--sup); width:100%;
  border:2px solid color-mix(in srgb,var(--tinta) 18%,transparent);
  border-radius:14px; padding:13px 15px; transition:border-color .25s;
}
.campo textarea{resize:vertical; min-height:132px}
.campo input:focus,.campo textarea:focus{outline:none; border-color:var(--ac)}
.campo-mel{position:absolute; left:-9999px}
.form-aviso{margin:16px 0 0; font-size:15px; min-height:1.4em; max-width:none}
.form-aviso.ok{color:var(--ac); font-weight:700}
.canais{display:grid; gap:10px; justify-items:start}
.canais h3{
  font-size:13px; letter-spacing:.16em; color:var(--suave);
  font-family:Quicksand,sans-serif; margin:0 0 6px;
}
.canal{
  display:inline-flex; align-items:center; gap:11px; text-decoration:none;
  padding:10px 20px 10px 10px; border-radius:999px;
  border:2px solid color-mix(in srgb,var(--tinta) 20%,transparent);
  font-family:Quicksand,sans-serif; font-weight:700; font-size:15px;
  transition:border-color .25s, transform .25s;
}
.canal:hover{border-color:var(--ac); transform:translateX(4px)}
.selo{
  width:32px; height:32px; border-radius:50%; background:var(--ac); color:var(--sobre-ac);
  display:grid; place-items:center; font-size:14px; font-weight:700; flex:none;
}
.canais-local{font-size:14px; color:var(--suave); margin:12px 0 0}

/* ---- Cortina de transição --------------------------------------------- */
.cortina{
  position:fixed; inset:0; z-index:90; background:var(--ac); pointer-events:none;
  transform:scaleY(0); transform-origin:bottom;
}
.cortina.entra{animation:cortinaEntra .55s cubic-bezier(.76,0,.24,1) forwards}
.cortina.sai{animation:cortinaSai .55s cubic-bezier(.76,0,.24,1) forwards}
@keyframes cortinaEntra{from{transform:scaleY(0); transform-origin:bottom}to{transform:scaleY(1); transform-origin:bottom}}
@keyframes cortinaSai{from{transform:scaleY(1); transform-origin:top}to{transform:scaleY(0); transform-origin:top}}

/* ---- Currículo -------------------------------------------------------- */
.cv-barra{
  display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  padding:120px 0 26px;
}
.cv-modos{display:flex; gap:8px; background:var(--sup); padding:5px; border-radius:999px}
.cv-modos button{
  padding:9px 20px; border-radius:999px; font-family:Quicksand,sans-serif; font-weight:700; font-size:15px;
  transition:background .25s, color .25s;
}
.cv-modos button[aria-pressed="true"]{background:var(--ac); color:var(--sobre-ac)}
.cv-aviso{font-size:14px; color:var(--suave); padding-bottom:20px; max-width:var(--medida)}

.cv-folha{
  background:#fff; color:#1a1a1a; width:min(820px,100%); margin:0 auto 90px;
  padding:52px 56px; border-radius:10px; box-shadow:0 26px 70px rgba(0,0,0,.25);
}
.cv-folha h1,.cv-folha h2,.cv-folha h3{color:inherit}
.cv-nome{font-size:40px; letter-spacing:-.02em; line-height:1}
.cv-cargo{font-family:Quicksand,sans-serif; font-weight:600; letter-spacing:.22em; font-size:13px; margin-top:8px}
.cv-contato{font-size:14px; margin-top:14px; color:#444}
.cv-secao{margin-top:30px}
.cv-secao > h2{font-size:15px; letter-spacing:.16em; margin-bottom:12px; font-family:Quicksand,sans-serif}
.cv-item{margin-bottom:18px; break-inside:avoid}
.cv-item h3{font-size:17px; font-family:Quicksand,sans-serif}
.cv-item .cv-linha{font-size:13.5px; color:#555; margin-bottom:6px}
.cv-item ul{margin:0; padding-left:19px; font-size:14.5px}
.cv-item ul li{margin-bottom:4px}
.cv-tags{display:flex; flex-wrap:wrap; gap:7px}
.cv-tags span{font-size:13.5px; padding:5px 12px; border-radius:999px; background:#f1eef2}

/* modelo criativo */
.cv-folha.criativo{border-top:14px solid var(--vinho-base)}
.cv-folha.criativo .cv-nome{color:var(--vinho-base); font-family:Quicksand,sans-serif}
.cv-folha.criativo .cv-cargo{color:#912049}
.cv-folha.criativo .cv-secao > h2{color:var(--vinho-base); border-bottom:2px solid #e27be6; padding-bottom:6px}
.cv-folha.criativo .cv-flor{width:54px; color:var(--vinho-base); float:right}

/* modelo ATS: uma coluna, sem cor, sem enfeite, texto selecionável */
.cv-folha.ats{
  font-family:Arial,Helvetica,sans-serif; color:#000; box-shadow:none;
  border:1px solid #ddd; border-radius:0;
}
.cv-folha.ats *{font-family:Arial,Helvetica,sans-serif !important; color:#000 !important}
.cv-folha.ats .cv-nome{font-size:26px; font-weight:bold}
.cv-folha.ats .cv-cargo{letter-spacing:0; font-size:15px; margin-top:2px}
.cv-folha.ats .cv-secao > h2{font-size:14px; letter-spacing:0; text-transform:none; border-bottom:1px solid #000; padding-bottom:3px}
.cv-folha.ats .cv-tags{display:block}
.cv-folha.ats .cv-tags span{background:none; padding:0; display:inline}
.cv-folha.ats .cv-tags span::after{content:", "}
.cv-folha.ats .cv-tags span:last-child::after{content:""}
.cv-folha.ats .cv-flor{display:none}


.pular{
  position:absolute; left:-9999px; top:10px; z-index:100;
  background:var(--ac); color:var(--sobre-ac); padding:12px 20px; border-radius:999px;
  text-decoration:none; font-family:Quicksand,sans-serif; font-weight:700;
}
.pular:focus{left:4vw}
.tema-dica{
  position:absolute; top:calc(100% + 10px); right:0;
  white-space:nowrap; background:var(--sup); color:var(--tinta); font-size:13.5px;
  font-family:Quicksand,sans-serif; font-weight:600;
  padding:7px 13px; border-radius:999px; box-shadow:0 8px 22px rgba(0,0,0,.18);
  opacity:0; pointer-events:none; transition:opacity .22s;
}
.tema:hover .tema-dica,.tema:focus-visible .tema-dica,.tema.mostra .tema-dica{opacity:1}
.chip .cont{opacity:.65; font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .cont{opacity:.8}
.cartao{border:1px solid color-mix(in srgb, var(--tinta) 10%, transparent)}

/* ---- Adesivos da marca ------------------------------------------------ */
.adesivos{display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin-top:36px}
.adesivos svg{height:62px; width:auto; filter:drop-shadow(0 7px 16px rgba(0,0,0,.24));
  transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.adesivos svg:nth-child(odd){transform:rotate(-7deg)}
.adesivos svg:nth-child(even){transform:rotate(6deg)}
.adesivos svg:hover{transform:rotate(0deg) scale(1.16)}

/* ---- Antes e depois --------------------------------------------------- */
.comp-modos{display:inline-flex; gap:6px; background:var(--sup); padding:5px; border-radius:999px; margin-top:54px}
.comp-modos button{padding:9px 24px; border-radius:999px; font-family:Quicksand,sans-serif;
  font-weight:700; font-size:15px; transition:background .25s, color .25s}
.comp-modos button[aria-pressed="true"]{background:var(--ac); color:var(--sobre-ac)}
.comp-modos + .proj-galeria{margin-top:20px}

/* ---- Impressão -------------------------------------------------------- */
@page{size:A4; margin:14mm}
@media print{
  body{background:#fff}
  .topo,.gaveta,.tema,.lupa,.cv-barra,.cv-aviso,.rodape,.cortina{display:none !important}
  .cv-folha{box-shadow:none; border:none; margin:0; padding:0; width:100%; border-radius:0}
  .cv-folha.criativo{border-top:10px solid var(--vinho-base)}
  .cv-item{page-break-inside:avoid}
}

/* ---- Telas menores ---------------------------------------------------- */
@media (max-width:900px){
  .nav-desk{display:none}
  .sanduiche{display:grid}
  .ades:nth-child(5),.ades:nth-child(6),.ades:nth-child(7){display:none}
  .capa{padding:110px 0 70px}
  .sobre-grade{grid-template-columns:1fr; gap:32px}
  .contato-grade{grid-template-columns:1fr; gap:38px}
  .bloco{grid-template-columns:1fr; gap:16px}
  .bloco-cab{position:static}
  .blocos{gap:54px}
  .gal-item.f-dupla,.gal-item.f-tripla{grid-column:span 6}
  .gal-item.f-retrato{grid-column:span 3}
  .galeria{gap:14px}
  .lupa{padding:80px 3vw}
  .lupa-btn{width:44px; height:44px}
  .grade{grid-template-columns:1fr}
  .cartao.largo{grid-column:span 1}
  .cv-folha{padding:32px 26px}
  .tom{padding:76px 0}
  section{padding:66px 0}
}
@media (max-width:520px){
  .ades:nth-child(2),.ades:nth-child(4){opacity:.85}
  .capa-frase{font-size:16.5px}

  .baixar-menu{position:fixed; right:4vw; left:4vw; width:auto}
  .proj-fichas{gap:22px}
  .ades{--esc:.44}
  .fita-fila{gap:18px}
  .fita-fila span{font-size:13px}
}

/* ---- Respeito a quem prefere menos movimento -------------------------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
  .reveal{opacity:1; transform:none}
  .fita-fila{animation:none}
  .ades-flt{animation:none}
  html{scroll-behavior:auto}
}
</style>

<script>
(function(){
  "use strict";
  const C = CONTEUDO;
  const POSICOES = [
    {lado:"esq", x:"6%",  y:"15%", tam:120, rot:"-12deg", dur:"7.5s",  atraso:".55s", mob:true,  ym:"6%"},
    {lado:"dir", x:"28%", y:"10%", tam:106, rot:"11deg",  dur:"8.5s",  atraso:".70s", mob:true,  ym:"5%"},
    {lado:"esq", x:"30%", y:"45%", tam:86,  rot:"15deg",  dur:"6.8s",  atraso:".85s", mob:false},
    {lado:"dir", x:"8%",  y:"38%", tam:92,  rot:"-9deg",  dur:"9.2s",  atraso:"1s",   mob:false},
    {lado:"esq", x:"5%",  y:"70%", tam:100, rot:"7deg",   dur:"7.9s",  atraso:"1.15s", mob:true, ym:"76%"},
    {lado:"dir", x:"32%", y:"62%", tam:124, rot:"-15deg", dur:"8.1s",  atraso:"1.3s", mob:false},
    {lado:"dir", x:"10%", y:"82%", tam:88,  rot:"6deg",   dur:"7.2s",  atraso:"1.45s", mob:false},
  ];
  const ADESIVOS = [[1, "0 0 231.72 231.72", 0.9, "11%", "6%", "clamp(66px,9vw,130px)", "-6deg", "7.5s"], [2, "0 0 136.73 106.52", 0.6, "63%", "9%", "clamp(54px,7vw,102px)", "5deg", "8.4s"], [3, "0 0 174.4 167.13", 0.8, "15%", "79%", "clamp(58px,8vw,114px)", "7deg", "6.8s"], [4, "0 0 225.33 223.63", 0.5, "65%", "77%", "clamp(62px,8.5vw,122px)", "-5deg", "9.1s"], [5, "0 0 145.07 164.72", 1.2, "42%", "3%", "clamp(38px,5vw,72px)", "9deg", "6.2s"], [6, "0 0 204.34 252.66", 1.1, "9%", "63%", "clamp(42px,5.5vw,80px)", "-8deg", "7.9s"], [7, "0 0 144.14 126.18", 1.3, "78%", "85%", "clamp(40px,5vw,76px)", "6deg", "5.9s"]];
  const app = document.getElementById("app");
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const eixoDe = id => C.eixos.find(e => e.id === id) || {nome:"", grupo:""};
  const flor = cls => '<svg class="'+cls+'" viewBox="0 0 120.68 119.77" aria-hidden="true"><use href="#flor"></use></svg>';

  /* ---- tema ----------------------------------------------------------- */
  const temas = ["claro","vinho","rosa","azul","carvao"];
  const nomeTema = {claro:"Claro", vinho:"Vinho", rosa:"Rosa", azul:"Azul", carvao:"Carvão"};
  let tema = 0;
  const dica = document.getElementById("temaDica");
  document.getElementById("btnTema").addEventListener("click", () => {
    tema = (tema + 1) % temas.length;
    document.body.dataset.tema = temas[tema];
    dica.textContent = "Cor do site: " + nomeTema[temas[tema]];
    const bt = document.getElementById("btnTema");
    bt.classList.add("mostra");
    clearTimeout(bt._t); bt._t = setTimeout(() => bt.classList.remove("mostra"), 1800);
  });

  /* ---- menu ----------------------------------------------------------- */
  const sand = document.getElementById("sanduiche");
  sand.addEventListener("click", () => {
    const on = document.body.classList.toggle("menu-on");
    sand.setAttribute("aria-expanded", on);
    sand.setAttribute("aria-label", on ? "Fechar menu" : "Abrir menu");
  });
  document.getElementById("gaveta").addEventListener("click", e => {
    if (e.target.tagName === "A") { document.body.classList.remove("menu-on"); sand.setAttribute("aria-expanded","false"); }
  });

  /* ---- menu de download ------------------------------------------------ */
  const cxBaixar = document.getElementById("baixar");
  const btBaixar = document.getElementById("btnBaixar");
  btBaixar.addEventListener("click", e => {
    e.stopPropagation();
    const on = cxBaixar.classList.toggle("aberto");
    btBaixar.setAttribute("aria-expanded", on);
  });
  document.addEventListener("click", e => {
    if (!cxBaixar.contains(e.target)) { cxBaixar.classList.remove("aberto"); btBaixar.setAttribute("aria-expanded","false"); }
  });
  const lp = document.getElementById("linkPortfolio");
  lp.href = C.arquivos.portfolioPdf || "#";
  lp.setAttribute("download","");

  /* ---- revelação ao rolar ---------------------------------------------- */
  let observador;
  function observar(){
    if (observador) observador.disconnect();
    observador = new IntersectionObserver(entradas => {
      entradas.forEach(en => { if (en.isIntersecting){ en.target.classList.add("revelado"); observador.unobserve(en.target); } });
    }, {threshold:.15, rootMargin:"0px 0px -60px"});
    document.querySelectorAll(".reveal").forEach(el => observador.observe(el));
  }

  window.addEventListener("scroll", () => {
    document.querySelector(".topo").classList.toggle("rolou", window.scrollY > 12);
  }, {passive:true});

  /* ---- blocos de página ------------------------------------------------ */
  /* ---- adesivos arrastáveis -------------------------------------------- */
  function ativarArrasto(){
    document.querySelectorAll(".ades").forEach(el => {
      let ox=0, oy=0, bx=0, by=0, ativo=false;
      el.addEventListener("pointerdown", e => {
        ativo = true; el.classList.add("arrastando");
        el.setPointerCapture(e.pointerId);
        ox = e.clientX; oy = e.clientY;
        bx = parseFloat(el.style.getPropertyValue("--dx")) || 0;
        by = parseFloat(el.style.getPropertyValue("--dy")) || 0;
        e.preventDefault();
      });
      el.addEventListener("pointermove", e => {
        if (!ativo) return;
        el.style.setProperty("--dx", (bx + e.clientX - ox) + "px");
        el.style.setProperty("--dy", (by + e.clientY - oy) + "px");
      });
      const soltar = () => { ativo = false; el.classList.remove("arrastando"); };
      el.addEventListener("pointerup", soltar);
      el.addEventListener("pointercancel", soltar);
    });
  }

  function blocoCapa(){
    const umAdesivo = (a, p) => `<div class="ades${p.mob ? "" : " so-desk"}"
        style="--x:${p.x}; --y:${p.y}; --ym:${p.ym || p.y}; --tam:${p.tam}px;
        --rot:${p.rot}; --dur:${p.dur}; --atraso:${p.atraso}">
        <div class="ades-ent"><div class="ades-flt">
          <svg viewBox="${a[1]}" aria-hidden="true"><use href="#stk-${a[0]}"></use></svg>
        </div></div>
      </div>`;
    const faixa = lado => ADESIVOS
      .map((a,i) => [a, POSICOES[i]])
      .filter(([,p]) => p.lado === lado)
      .map(([a,p]) => umAdesivo(a,p)).join("");
    const ad = `<div class="ades-faixa esq">${faixa("esq")}</div>
                <div class="ades-faixa dir">${faixa("dir")}</div>`;

    const fita = C.eixos.map(e =>
      `<span>${esc(e.nome)}</span><svg class="fita-flor" viewBox="0 0 120.68 119.77" aria-hidden="true"><use href="#flor"></use></svg>`
    ).join("");

    return `
    <section class="capa">
      <div class="capa-ades" aria-hidden="true">${ad}</div>
      <div class="env capa-centro">
        <div class="capa-flor anim-flor">${flor("marca-svg")}</div>
        <h1 class="subir d1">${esc(C.marca.nome)}</h1>
        <p class="capa-cargo subir d2">${esc(C.marca.cargo)}</p>
        <p class="capa-frase subir d3">${esc(C.marca.frase)}</p>
        <div class="capa-cta subir d4">
          <a class="btn btn-cheio" href="#/#trabalhos">Ver os trabalhos</a>
          <a class="btn btn-vazio" href="#/#contato">Falar comigo</a>
        </div>
        <p class="capa-dica subir d4">Pegue os adesivos e arraste onde quiser</p>
      </div>
      <div class="fita" aria-hidden="true"><div class="fita-fila">${fita}${fita}</div></div>
    </section>`;
  }

  function blocoTrabalhos(){
    const conta = id => C.projetos.filter(p => p.eixo === id).length;
    const chips = [`<button class="chip" data-eixo="todos" aria-pressed="true">Todos <span class="cont">${C.projetos.length}</span></button>`]
      .concat(C.eixos.map(e => `<button class="chip" data-eixo="${esc(e.id)}" aria-pressed="false">${esc(e.nome)} <span class="cont">${conta(e.id)}</span>${e.grupo?`<small>${esc(e.grupo)}</small>`:""}</button>`))
      .join("");
    return `
    <section id="trabalhos">
      <div class="env">
        <div class="reveal">
          <h2 class="secao-titulo">Trabalhos</h2>
          <div class="secao-linha"></div>
        </div>
        <div class="filtros reveal" id="filtros">${chips}</div>
        <div class="grade" id="grade"></div>
      </div>
    </section>`;
  }

  function cartao(p){
    const e = eixoDe(p.eixo);
    const capa = p.capa
      ? `<img src="${esc(p.capa)}" alt="${esc(p.titulo)}" loading="lazy"
             style="object-position:${esc(p.capaFoco || "center")}" onerror="this.remove()">`
      : "";
    return `
    <a class="cartao reveal ${p.destaque ? "largo":""}" href="#/projeto/${esc(p.id)}">
      <div class="cartao-img">${capa || flor("flor-fundo")}</div>
      <div class="cartao-txt">
        <div class="cartao-meta"><span>${esc(e.nome)}</span><span>·</span><span>${esc(p.ano)}</span></div>
        <h3>${esc(p.titulo)}</h3>
        <p>${esc(p.resumo)}</p>
      </div>
    </a>`;
  }

  function pintarGrade(filtro){
    const grade = document.getElementById("grade");
    if (!grade) return;
    const lista = filtro === "todos" ? C.projetos : C.projetos.filter(p => p.eixo === filtro);
    grade.innerHTML = lista.length
      ? lista.map(cartao).join("")
      : `<p class="vazio">Nenhum projeto neste eixo ainda.</p>`;
    observar();
  }

  function blocoSobre(){
    const s = C.sobre;
    const foto = s.foto ? `<img src="${esc(s.foto)}" alt="Retrato de ${esc(C.marca.nome)}" onerror="this.remove()">` : flor("flor-fundo");
    return `
    <section id="sobre" class="tom tom-a">
      <div class="env sobre-grade">
        <div class="sobre-foto reveal">${foto}</div>
        <div class="reveal">
          <h2 class="secao-titulo">${esc(s.titulo)}</h2>
          <div class="secao-linha"></div>
          ${s.paragrafos.map(p => `<p>${esc(p)}</p>`).join("")}
          <ul class="servicos">${s.servicos.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
          <div class="adesivos" aria-hidden="true">${ADESIVOS.map(a =>
            `<svg viewBox="${a[1]}"><use href="#stk-${a[0]}"></use></svg>`).join("")}</div>
        </div>
      </div>
    </section>`;
  }

  function blocoContato(){
    const c = C.contato;
    const canal = (selo, nome, href, alvo) =>
      `<a class="canal" href="${esc(href)}"${alvo ? ' target="_blank" rel="noopener"' : ""}>
         <span class="selo" aria-hidden="true">${esc(selo)}</span>${esc(nome)}</a>`;
    return `
    <section id="contato" class="tom tom-b">
      <div class="env reveal">
        <h2 class="secao-titulo">Entre em contato</h2>
        <div class="secao-linha"></div>
        <p>Conta o que você precisa e eu respondo com um caminho possível.</p>

        <div class="contato-grade">
          <form class="form" id="formContato" novalidate>
            <p class="campo">
              <label for="fNome">Seu nome</label>
              <input id="fNome" name="nome" type="text" required autocomplete="name">
            </p>
            <p class="campo">
              <label for="fEmail">Seu e-mail</label>
              <input id="fEmail" name="email" type="email" required autocomplete="email">
            </p>
            <p class="campo">
              <label for="fMsg">Como posso ajudar?</label>
              <textarea id="fMsg" name="mensagem" rows="5" required></textarea>
            </p>
            <p class="campo-mel"><label>Deixe este campo vazio<input name="bot-field" tabindex="-1"></label></p>
            <button class="btn btn-cheio" type="submit" id="fEnviar">Enviar mensagem</button>
            <p class="form-aviso" id="formAviso" role="status" aria-live="polite"></p>
          </form>

          <aside class="canais">
            <h3>Ou me encontre em</h3>
            ${c.redes.map(r => canal(r.selo || "→", r.nome, r.url, true)).join("")}
            ${canal("@", "E-mail", "mailto:" + c.email, false)}
            <p class="canais-local">${esc(c.cidade)}</p>
          </aside>
        </div>
      </div>
    </section>`;
  }

  /* ---- envio do formulário ---------------------------------------------- */
  function ligarFormulario(){
    const f = document.getElementById("formContato");
    if (!f) return;
    const aviso = document.getElementById("formAviso");
    const botao = document.getElementById("fEnviar");
    f.addEventListener("submit", async e => {
      e.preventDefault();
      if (!f.checkValidity()) {
        aviso.className = "form-aviso erro";
        aviso.textContent = "Nome, e-mail e mensagem são obrigatórios.";
        f.reportValidity(); return;
      }
      const destino = (C.contato.formulario && C.contato.formulario.destino) || "netlify";
      const externo = /^https?:/.test(destino);
      const dados = {
        "form-name": "contato", nome: f.nome.value, email: f.email.value,
        mensagem: f.mensagem.value, "bot-field": f["bot-field"].value,
      };
      botao.disabled = true;
      aviso.className = "form-aviso";
      aviso.textContent = "Enviando…";
      try {
        const r = await fetch(externo ? destino : "/", externo
          ? { method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body: JSON.stringify(dados) }
          : { method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body: new URLSearchParams(dados).toString() });
        if (!r.ok) throw new Error(r.status);
        f.reset();
        aviso.className = "form-aviso ok";
        aviso.textContent = "Mensagem enviada. Respondo assim que possível.";
      } catch (err) {
        aviso.className = "form-aviso erro";
        aviso.innerHTML = "Não consegui enviar agora. Me escreve direto em " +
          `<a href="mailto:${esc(C.contato.email)}">${esc(C.contato.email)}</a>.`;
      } finally {
        botao.disabled = false;
      }
    });
  }

  function blocoRodape(){
    return `<div class="env rodape">
      <span>${esc(C.marca.nome)} — ${esc(C.contato.cidade)}</span>
      <span>© ${new Date().getFullYear()}</span>
    </div>`;
  }

  /* ---- páginas --------------------------------------------------------- */
  function paginaInicio(){
    app.innerHTML = blocoCapa() + blocoTrabalhos() + blocoSobre() + blocoContato() + blocoRodape();
    ativarArrasto();
    ligarFormulario();
    pintarGrade("todos");
    document.getElementById("filtros").addEventListener("click", e => {
      const b = e.target.closest(".chip"); if (!b) return;
      document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      pintarGrade(b.dataset.eixo);
    });
  }

  /* ---- galeria: aceita "caminho.jpg" ou {src, formato, legenda} --------- */
  const FORMATOS = ["cheia","sangria","dupla","tripla","retrato"];
  function normImg(it){
    const o = (typeof it === "string") ? { src: it } : Object.assign({}, it);
    if (FORMATOS.indexOf(o.formato) < 0) o.formato = "cheia";
    return o;
  }
  function galeria(lista, alt){
    const itens = (lista || []).map(normImg).filter(i => i.src);
    if (!itens.length) return "";
    return `<div class="galeria">${itens.map(im => `
      <figure class="gal-item f-${im.formato}">
        <img src="${esc(im.src)}" alt="${esc(im.legenda || alt || "")}" loading="lazy"
             data-zoom="${esc(im.src)}" data-leg="${esc(im.legenda || "")}"
             onerror="this.closest('figure').style.display='none'">
        ${im.legenda ? `<figcaption>${esc(im.legenda)}</figcaption>` : ""}
      </figure>`).join("")}</div>`;
  }

  function paginaProjeto(id){
    const p = C.projetos.find(x => x.id === id);
    if (!p) { location.hash = "#/"; return; }
    const e = eixoDe(p.eixo);
    const img = src => `<img src="${esc(src)}" alt="${esc(p.titulo)}" loading="lazy" onerror="this.style.display='none'">`;
    const temComp = !!(p.antes && p.depois);

    /* ficha técnica: só entra o que o projeto tiver preenchido */
    const fichas = [
      ["Eixo", e.nome], ["Cliente", p.cliente], ["Meu papel", p.papel],
      ["Ano", p.ano], ["Duração", p.duracao], ["Equipe", p.equipe],
      ["Ferramentas", (p.ferramentas || []).join(", ")],
    ].filter(f => f[1])
     .map(f => `<div class="ficha"><span>${esc(f[0])}</span><strong>${esc(f[1])}</strong></div>`).join("");

    const metricas = (p.metricas && p.metricas.length)
      ? `<div class="metricas reveal">${p.metricas.map(m =>
          `<div><strong>${esc(m.valor)}</strong><span>${esc(m.rotulo)}</span></div>`).join("")}</div>`
      : "";

    /* corpo: blocos numerados quando o case tem estrutura, texto corrido quando não */
    let corpo;
    if (p.blocos && p.blocos.length) {
      corpo = `<div class="blocos">${p.blocos.map((b,i) => `
        <section class="bloco reveal">
          <div class="bloco-cab">
            <span class="bloco-num">${String(i+1).padStart(2,"0")}</span>
            <h2>${esc(b.titulo)}</h2>
          </div>
          <div class="bloco-corpo">
            ${(b.texto || []).map(t => `<p>${esc(t)}</p>`).join("")}
            ${(b.lista && b.lista.length) ? `<ul class="bloco-lista">${b.lista.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
            ${galeria(b.imagens, p.titulo + " — " + b.titulo)}
          </div>
        </section>`).join("")}</div>`;
    } else if (temComp) {
      corpo = `<div class="proj-texto">${(p.descricao||[]).map(t => `<p>${esc(t)}</p>`).join("")}</div>
        <div class="comp-modos" id="comp">
          <button data-fase="antes" aria-pressed="false">Antes</button>
          <button data-fase="depois" aria-pressed="true">Depois</button>
        </div>
        <div id="compGal">${galeria(p.depois, p.titulo)}</div>`;
    } else {
      const vazio = `<div class="vago">Adicione as imagens deste projeto na lista <strong>imagens</strong> do bloco de conteúdo.</div>`;
      corpo = `<div class="proj-texto">${(p.descricao||[]).map(t => `<p>${esc(t)}</p>`).join("")}</div>
        ${(p.imagens && p.imagens.length) ? galeria(p.imagens, p.titulo) : vazio}`;
    }

    const aprendizados = (p.aprendizados && p.aprendizados.length)
      ? `<section class="tom tom-a aprendi">
           <div class="env reveal">
             <h2 class="secao-titulo">O que eu levei desse projeto</h2>
             <div class="secao-linha"></div>
             <ul>${p.aprendizados.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
           </div>
         </section>`
      : "";

    /* próximo projeto do mesmo eixo, para não terminar em beco sem saída */
    const irmaos = C.projetos.filter(x => x.eixo === p.eixo);
    const prox = irmaos[(irmaos.indexOf(p) + 1) % irmaos.length];
    const proximo = (prox && prox.id !== p.id)
      ? `<div class="env proximo reveal">
           <span>Próximo em ${esc(e.nome)}</span>
           <a href="#/projeto/${esc(prox.id)}">${esc(prox.titulo)} →</a>
         </div>` : "";

    app.innerHTML = `
      <section class="proj-topo">
        <div class="env">
          <a class="voltar" href="#/#trabalhos">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            Trabalhos
          </a>
          <h1 class="proj-titulo">${esc(p.titulo)}</h1>
          <p class="proj-resumo">${esc(p.resumo)}</p>
          <div class="proj-fichas">${fichas}</div>
          ${metricas}
          ${corpo}
        </div>
      </section>
      ${aprendizados}
      ${proximo}
      ${blocoContato()}${blocoRodape()}`;

    ligarFormulario();

    if (temComp) {
      document.getElementById("comp").addEventListener("click", ev => {
        const b = ev.target.closest("button"); if (!b) return;
        document.querySelectorAll("#comp button").forEach(x => x.setAttribute("aria-pressed", x === b));
        document.getElementById("compGal").innerHTML = galeria(p[b.dataset.fase], p.titulo);
      });
    }
  }

  function paginaCurriculo(modelo){
    const cv = C.curriculo, c = C.contato;
    const criativo = modelo !== "ats";
    const contatoLinha = [c.email, c.telefone, c.cidade].filter(Boolean).join("  ·  ");
    const links = c.redes.map(r => r.url.replace(/^https?:\/\//,"")).join("  ·  ");

    const folha = `
      <div class="cv-folha ${criativo ? "criativo":"ats"}" id="cvFolha">
        ${criativo ? flor("cv-flor") : ""}
        <h1 class="cv-nome">${esc(C.marca.nome)}</h1>
        <p class="cv-cargo">${esc(C.marca.cargo)}</p>
        <p class="cv-contato">${esc(contatoLinha)}<br>${esc(links)}</p>

        <div class="cv-secao">
          <h2>Resumo</h2>
          <p>${esc(cv.resumo)}</p>
        </div>

        <div class="cv-secao">
          <h2>Experiência</h2>
          ${cv.experiencias.map(x => `
            <div class="cv-item">
              <h3>${esc(x.cargo)}</h3>
              <div class="cv-linha">${esc(x.empresa)} · ${esc(x.periodo)}${x.local ? " · " + esc(x.local) : ""}</div>
              <ul>${x.itens.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
            </div>`).join("")}
        </div>

        <div class="cv-secao">
          <h2>Formação</h2>
          ${cv.formacao.map(f => `
            <div class="cv-item">
              <h3>${esc(f.curso)}</h3>
              <div class="cv-linha">${esc(f.instituicao)} · ${esc(f.periodo)}</div>
            </div>`).join("")}
        </div>

        ${cv.cursos && cv.cursos.length ? `
        <div class="cv-secao">
          <h2>Cursos</h2>
          ${cv.cursos.map(f => `<div class="cv-item"><div class="cv-linha">${esc(f.nome)} · ${esc(f.instituicao)} · ${esc(f.ano)}</div></div>`).join("")}
        </div>` : ""}

        <div class="cv-secao">
          <h2>Habilidades</h2>
          <div class="cv-tags">${cv.habilidades.map(h => `<span>${esc(h)}</span>`).join("")}</div>
        </div>

        <div class="cv-secao">
          <h2>Idiomas</h2>
          <div class="cv-tags">${cv.idiomas.map(i => `<span>${esc(i.idioma)} — ${esc(i.nivel)}</span>`).join("")}</div>
        </div>
      </div>`;

    app.innerHTML = `
      <div class="env">
        <div class="cv-barra">
          <div class="cv-modos">
            <button data-modelo="criativo" aria-pressed="${criativo}">Criativo</button>
            <button data-modelo="ats" aria-pressed="${!criativo}">ATS</button>
          </div>
          <button class="btn btn-cheio" id="btnImprimir">Baixar em PDF</button>
        </div>
        <p class="cv-aviso">${criativo
          ? "Modelo criativo: usa a identidade visual. Ideal para enviar direto a um estúdio ou anexar em uma proposta."
          : "Modelo ATS: uma coluna, sem cor e sem elementos gráficos, do jeito que os sistemas de triagem conseguem ler. Use este em vagas de portais grandes."}</p>
        ${folha}
      </div>`;

    app.querySelector(".cv-modos").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      location.hash = "#/curriculo/" + b.dataset.modelo;
    });
    document.getElementById("btnImprimir").addEventListener("click", () => window.print());
  }

  /* ---- lupa: clique na imagem para ampliar ------------------------------ */
  const lupa = document.getElementById("lupa");
  const lupaImg = document.getElementById("lupaImg");
  const lupaLeg = document.getElementById("lupaLeg");
  let lista = [], atual = 0, focoAnterior = null;

  function mostrarLupa(i){
    atual = (i + lista.length) % lista.length;
    const el = lista[atual];
    lupaImg.src = el.dataset.zoom;
    lupaImg.alt = el.alt || "";
    lupaLeg.textContent = el.dataset.leg || "";
    lupaLeg.hidden = !el.dataset.leg;
    const varios = lista.length > 1;
    document.getElementById("lupaAnt").hidden = !varios;
    document.getElementById("lupaProx").hidden = !varios;
  }
  function abrirLupa(el){
    const grade = el.closest(".galeria");
    lista = grade ? Array.from(grade.querySelectorAll("img[data-zoom]")) : [el];
    focoAnterior = document.activeElement;
    lupa.hidden = false;
    document.body.style.overflow = "hidden";
    mostrarLupa(lista.indexOf(el));
    document.getElementById("lupaFechar").focus();
  }
  function fecharLupa(){
    lupa.hidden = true;
    lupaImg.removeAttribute("src");
    document.body.style.overflow = "";
    if (focoAnterior) focoAnterior.focus();
  }
  document.addEventListener("click", ev => {
    const alvo = ev.target.closest("img[data-zoom]");
    if (alvo) { abrirLupa(alvo); return; }
    if (ev.target === lupa) fecharLupa();
  });
  document.getElementById("lupaFechar").addEventListener("click", fecharLupa);
  document.getElementById("lupaAnt").addEventListener("click", () => mostrarLupa(atual - 1));
  document.getElementById("lupaProx").addEventListener("click", () => mostrarLupa(atual + 1));
  document.addEventListener("keydown", ev => {
    if (lupa.hidden) return;
    if (ev.key === "Escape") fecharLupa();
    if (ev.key === "ArrowLeft") mostrarLupa(atual - 1);
    if (ev.key === "ArrowRight") mostrarLupa(atual + 1);
  });

  /* ---- roteador -------------------------------------------------------- */
  const cortina = document.getElementById("cortina");
  let primeira = true;

  function desenhar(){
    const h = location.hash.replace(/^#\/?/, "");
    const partes = h.split("/");
    if (partes[0] === "projeto" && partes[1]) paginaProjeto(partes[1]);
    else if (partes[0] === "curriculo") paginaCurriculo(partes[1] || "criativo");
    else {
      paginaInicio();
      const alvo = h.startsWith("#") ? h.slice(1) : "";
      if (alvo) { requestAnimationFrame(() => document.getElementById(alvo)?.scrollIntoView()); return; }
    }
    window.scrollTo(0,0);
  }

  function navegar(){
    if (primeira){ primeira = false; desenhar(); observar(); return; }
    const reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduz){ desenhar(); observar(); return; }
    cortina.className = "cortina entra";
    setTimeout(() => {
      desenhar(); observar();
      cortina.className = "cortina sai";
    }, 520);
  }

  /* adesivos acompanham o cursor, de leve */
  let pend = false, ex = 0, ey = 0;
  document.addEventListener("pointermove", e => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    ex = e.clientX; ey = e.clientY;
    if (pend) return;
    pend = true;
    requestAnimationFrame(() => {
      pend = false;
      const capa = document.querySelector(".capa");
      if (!capa) return;
      const r = capa.getBoundingClientRect();
      if (ey < r.top || ey > r.bottom) return;
      const nx = (ex - r.left - r.width / 2) / (r.width / 2);
      const ny = (ey - r.top - r.height / 2) / (r.height / 2);
      capa.querySelectorAll(".ades").forEach(el => {
        const d = parseFloat(el.dataset.p) || 0;
        el.style.setProperty("--px", (nx * d * 26).toFixed(1) + "px");
        el.style.setProperty("--py", (ny * d * 18).toFixed(1) + "px");
      });
    });
  }, {passive:true});

  window.addEventListener("hashchange", navegar);
  if (!location.hash) location.hash = "#/";
  navegar();
})();
</script>
</body>
</html>
