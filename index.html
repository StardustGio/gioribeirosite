.proj-texto{max-width:var(--medida); font-size:18px}
.proj-galeria{display:grid; gap:20px; margin-top:52px}
.proj-galeria img{width:100%; border-radius:var(--raio)}
.proj-galeria .vago{
  aspect-ratio:16/9; border-radius:var(--raio); background:var(--sup);
  display:grid; place-items:center; color:var(--suave); font-size:15px; text-align:center; padding:20px;
}
.voltar{display:inline-flex; align-items:center; gap:9px; text-decoration:none; font-weight:700;
  font-family:Quicksand,sans-serif; color:var(--ac)}

/* ---- Contato ---------------------------------------------------------- */
.contato-mail{
  font-family:Quicksand,sans-serif; font-weight:700; letter-spacing:-.02em;
  font-size:clamp(24px,5.5vw,58px); text-decoration:none; display:inline-block;
  word-break:break-word;
}
.contato-mail:hover{color:var(--ac)}
.redes{display:flex; flex-wrap:wrap; gap:12px; margin-top:34px}

.rodape{
  padding:36px 0; border-top:1px solid color-mix(in srgb,var(--tinta) 14%,transparent);
  display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:center;
  font-size:14px; color:var(--suave);
}

/* ---- Faixas de cor por seção ------------------------------------------- */
/* Cada faixa redefine os mesmos tokens do tema, então todo componente que já  */
/* usa var(--tinta), var(--ac) etc. se adapta sozinho, sem CSS duplicado.      */
.tom{
  padding:108px 0; color:var(--tinta); background:var(--base);
  transition:background .5s ease, color .5s ease;
}
.tom-a{
  --base:var(--a-base); --sup:var(--a-sup); --tinta:var(--a-tinta);
  --suave:var(--a-suave); --ac:var(--a-ac); --sobre-ac:var(--a-sobre);
}
.tom-b{
  --base:var(--b-base); --sup:var(--b-sup); --tinta:var(--b-tinta);
  --suave:var(--b-suave); --ac:var(--b-ac); --sobre-ac:var(--b-sobre);
}

/* ---- Case: blocos numerados -------------------------------------------- */
.proj-resumo{font-size:clamp(19px,2.3vw,25px); color:var(--suave); max-width:36ch; margin-bottom:0}
.metricas{
  display:flex; flex-wrap:wrap; gap:14px; margin:0 0 54px;
}
.metricas > div{
  background:var(--sup); border-radius:var(--raio); padding:20px 26px; min-width:150px;
  border:1px solid color-mix(in srgb,var(--tinta) 10%,transparent);
}
.metricas strong{
  display:block; font-family:Quicksand,sans-serif; font-weight:700;
  font-size:clamp(24px,3vw,34px); letter-spacing:-.02em; color:var(--ac); line-height:1.1;
}
.metricas span{font-size:14px; color:var(--suave)}

/* ---- Página de projeto: abertura, intro, índice e seções ------------- */
.proj-topo{padding-bottom:46px}
.proj-meta{margin:26px 0 0}
.proj-titulo{margin-top:6px}
.abertura{margin:0; width:100%; height:min(56.25vw, 86vh); overflow:hidden; background:var(--sup)}
.abertura img{width:100%; height:100%; object-fit:cover; display:block}
.abertura.contida{display:flex; justify-content:center; align-items:center; padding:clamp(20px,3.5vw,48px) 4vw}
.abertura.contida img{width:auto; max-width:100%; height:100%; object-fit:contain; border-radius:var(--raio);
  box-shadow:0 18px 50px -20px rgba(0,0,0,.35)}
.proj-intro{padding:64px 0 54px}
.intro-grade{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr); gap:60px; align-items:start}
.intro-grade.sem-texto{grid-template-columns:1fr}
.intro-txt p{font-size:clamp(18px,1.7vw,21px); line-height:1.6}
.intro-grade .proj-fichas{margin:0; display:grid; gap:20px; padding-top:0; border-top:0;
  padding-left:30px; border-left:1px solid color-mix(in srgb,var(--tinta) 16%,transparent)}
.intro-grade.sem-texto .proj-fichas{display:flex; flex-wrap:wrap; gap:26px 36px; padding-left:0; border-left:0;
  padding-top:22px; border-top:1px solid color-mix(in srgb,var(--tinta) 16%,transparent)}
.proj-intro .metricas{margin:44px 0 0}

.indice{
  position:sticky; top:76px; z-index:40;
  background:color-mix(in srgb, var(--base) 88%, transparent); backdrop-filter:blur(12px);
  border-block:1px solid color-mix(in srgb,var(--tinta) 12%,transparent);
}
.indice-fila{display:flex; gap:6px; overflow-x:auto; padding:10px 0; scrollbar-width:none}
.indice-fila::-webkit-scrollbar{display:none}
.indice a{
  flex:0 0 auto; padding:7px 16px; border-radius:999px; text-decoration:none; white-space:nowrap;
  font-family:Quicksand,sans-serif; font-weight:600; font-size:14.5px; color:var(--suave);
  transition:background .25s, color .25s;
}
.indice a:hover{color:var(--tinta)}
.indice a.ativo{background:var(--ac); color:var(--sobre-ac)}

.secao-case{padding:96px 0; background:var(--base); color:var(--tinta); scroll-margin-top:124px;
  transition:background .5s ease, color .5s ease}
.tom-base{}
.secao-cab{display:grid; grid-template-columns:260px minmax(0,1fr); gap:48px; align-items:start}
.secao-rot h2{font-size:clamp(24px,2.8vw,34px); letter-spacing:-.02em}
.secao-txt p{font-size:17.5px}
.secao-txt:empty{display:none}
.secao-visual{margin-top:10px}
.secao-visual > .etapas, .secao-visual > .fluxo{margin-top:34px}
.secao-case .comp-modos{margin-top:34px}
.pendente{outline:2px dashed var(--ac); outline-offset:6px; border-radius:4px; opacity:.85}

.proximo-sec{padding:90px 0 80px}
.proximo-card{
  display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); align-items:center;
  background:var(--sup); border-radius:var(--raio); overflow:hidden; text-decoration:none;
  transition:transform .45s cubic-bezier(.22,1,.36,1);
}
.proximo-card:hover{transform:translateY(-6px)}
.proximo-img{aspect-ratio:16/11; overflow:hidden; display:grid; place-items:center; background:var(--base)}
.proximo-img img{width:100%; height:100%; object-fit:cover}
.proximo-txt{padding:30px clamp(24px,4vw,52px)}
.proximo-txt span{display:block; font-size:12.5px; letter-spacing:.12em; color:var(--ac); font-weight:700; margin-bottom:10px}
.proximo-txt strong{display:block; font-family:Quicksand,sans-serif; font-size:clamp(26px,3.6vw,42px); letter-spacing:-.02em; line-height:1.1}
.proximo-txt p{color:var(--suave); margin:12px 0 0; font-size:16px}
.todos{margin-top:26px}
.bloco-lista{margin:4px 0 0; padding-left:20px; max-width:var(--medida)}
.bloco-lista li{margin-bottom:9px; font-size:17px}
.bloco-lista li::marker{color:var(--ac)}
.bloco-imgs{display:grid; gap:18px; margin-top:28px}
.bloco-imgs img{width:100%; border-radius:var(--raio)}

.aprendi{margin-top:90px}
.aprendi ul{margin:0; padding-left:20px; max-width:var(--medida)}
.aprendi li{margin-bottom:12px; font-size:17.5px}
.aprendi li::marker{color:var(--ac)}

.proximo{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:14px;
  padding:54px 0 10px; border-bottom:1px solid color-mix(in srgb,var(--tinta) 14%,transparent);
}
.proximo span{font-size:13px; letter-spacing:.14em; color:var(--suave); font-weight:700}
.proximo a{
  font-family:Quicksand,sans-serif; font-weight:700; text-decoration:none;
  font-size:clamp(24px,4vw,40px); letter-spacing:-.02em; transition:color .25s;
}
.proximo a:hover{color:var(--ac)}

/* ---- Etapas de metodologia (HTML, não imagem) --------------------------- */
.etapas{
  list-style:none; margin:30px 0 0; padding:0; display:grid; gap:18px;
  grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
}
.etapa{display:grid; gap:12px; align-content:start}
.etapa-disco{
  aspect-ratio:1; border-radius:50%; display:grid; place-content:center; text-align:center;
  padding:12px; transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.etapa:hover .etapa-disco{transform:scale(1.05)}
.etapa-num{display:block; font-size:12px; letter-spacing:.14em; font-weight:700}
.etapa-nome{
  display:block; font-family:Quicksand,sans-serif; font-weight:700;
  font-size:clamp(15px,1.7vw,19px); line-height:1.15; margin-top:4px;
}
.etapa-txt{font-size:14.5px; color:var(--suave); margin:0; line-height:1.5; max-width:none}

/* ---- Fluxo de telas ----------------------------------------------------- */
.fluxo{
  display:grid; gap:18px; margin-top:30px;
  grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
}
.fluxo-col{
  background:var(--sup); border-radius:var(--raio); padding:20px;
  border:1px solid color-mix(in srgb,var(--tinta) 12%,transparent);
}
.fluxo-grupo{
  font-size:13px; letter-spacing:.13em; color:var(--ac);
  font-family:Quicksand,sans-serif; margin:0 0 12px;
}
.fluxo-passos{list-style:none; margin:0; padding:0; display:grid; gap:9px}
.fluxo-passos li{
  font-size:15px; line-height:1.45; padding-left:19px; position:relative;
}
.fluxo-passos li::before{
  content:"→"; position:absolute; left:0; color:var(--ac); font-weight:700;
}

/* ---- Galeria: grade de 6 colunas, formato por imagem -------------------- */
.galeria{display:grid; gap:26px; margin-top:34px}
.gal-grupo{
  --gap:20px; --kk:var(--k);
  display:flex; flex-wrap:wrap; justify-content:center; gap:var(--gap);
}
.gal-item{margin:0; display:grid; gap:9px; align-content:start;
  flex:0 0 calc((100% - var(--gap) * (var(--kk) - 1)) / var(--kk)); min-width:0}
.gal-item img{
  width:100%; border-radius:var(--raio); cursor:zoom-in; display:block;
  background:var(--sup); transition:transform .4s cubic-bezier(.22,1,.36,1);
}
.gal-item img:hover{transform:scale(1.012)}
.gal-item figcaption{font-size:14px; color:var(--suave); line-height:1.5}
.f-cheia .gal-item img{width:auto; max-width:100%; max-height:88vh; margin-inline:auto}
.f-dupla .gal-item img{aspect-ratio:4/3; object-fit:cover}
.f-tripla .gal-item img{aspect-ratio:1/1; object-fit:cover}
.f-retrato .gal-item img{aspect-ratio:9/17; object-fit:cover}
.f-post .gal-item img{aspect-ratio:4/5; object-fit:cover}
.gal-grupo.f-sangria{width:100vw; margin-left:calc(50% - 50vw); gap:26px}
.f-sangria .gal-item img{border-radius:0; width:auto; max-width:100%; max-height:92vh; margin-inline:auto}
.f-sangria .gal-item figcaption{width:min(1180px,92vw); margin-inline:auto}

/* ---- Lupa --------------------------------------------------------------- */
/* o atributo hidden precisa vencer o display da classe, senão a lupa nasce aberta */
.lupa{display:none}
.lupa:not([hidden]){
  position:fixed; inset:0; z-index:120; display:grid; place-items:center;
  background:color-mix(in srgb,#070707 88%, transparent); padding:70px 4vw;
  animation:aparece .25s ease both;
}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.lupa-quadro{margin:0; display:grid; gap:12px; justify-items:center; pointer-events:none}
.lupa.alto{align-content:start; overflow:auto}
.lupa.alto .lupa-quadro img{max-height:none; max-width:min(760px,92vw)}
.lupa-quadro img{
  max-width:min(1200px,92vw); max-height:78svh; width:auto; object-fit:contain;
  border-radius:10px; box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.lupa-quadro figcaption{color:#f2f2f2; font-size:15px; text-align:center; max-width:60ch}
.lupa-btn{
  position:absolute; width:52px; height:52px; border-radius:50%;
  background:#f2f2f2; color:#070707; font-size:30px; line-height:1;
  display:grid; place-items:center; transition:transform .25s;
}
.lupa-btn[hidden]{display:none}
.lupa-btn:hover{transform:scale(1.1)}
.lupa-fechar{top:22px; right:4vw; font-size:26px}
.lupa-ant{left:4vw; top:50%; margin-top:-26px}
.lupa-prox{right:4vw; top:50%; margin-top:-26px}

/* ---- Contato ----------------------------------------------------------- */
.contato-grade{display:grid; grid-template-columns:1.2fr .8fr; gap:56px; margin-top:38px; align-items:start}
.campo{display:grid; gap:7px; margin:0 0 18px; max-width:none}
.campo label{font-family:Quicksand,sans-serif; font-weight:600; font-size:14.5px}
.campo input,.campo textarea{
  font:inherit; font-size:16px; color:var(--tinta); background:var(--sup); width:100%;
  border:2px solid color-mix(in srgb,var(--tinta) 18%,transparent);
  border-radius:14px; padding:13px 15px; transition:border-color .25s;
}
.campo textarea{resize:vertical; min-height:132px}
.campo input:focus,.campo textarea:focus{outline:none; border-color:var(--ac)}
.campo-mel{position:absolute; left:-9999px}
.form-aviso{margin:16px 0 0; font-size:15px; min-height:1.4em; max-width:none}
.form-aviso.ok{color:var(--ac); font-weight:700}
.canais{display:grid; gap:10px; justify-items:start}
.canais h3{
  font-size:13px; letter-spacing:.16em; color:var(--suave);
  font-family:Quicksand,sans-serif; margin:0 0 6px;
}
.canal{
  display:inline-flex; align-items:center; gap:11px; text-decoration:none;
  padding:10px 20px 10px 10px; border-radius:999px;
  border:2px solid color-mix(in srgb,var(--tinta) 20%,transparent);
  font-family:Quicksand,sans-serif; font-weight:700; font-size:15px;
  transition:border-color .25s, transform .25s;
}
.canal:hover{border-color:var(--ac); transform:translateX(4px)}
.selo{
  width:32px; height:32px; border-radius:50%; background:var(--ac); color:var(--sobre-ac);
  display:grid; place-items:center; font-size:14px; font-weight:700; flex:none;
}
.canais-local{font-size:14px; color:var(--suave); margin:12px 0 0}

/* ---- Cortina de transição --------------------------------------------- */
.cortina{
  position:fixed; inset:0; z-index:90; background:var(--ac); pointer-events:none;
  transform:scaleY(0); transform-origin:bottom;
}
.cortina.entra{animation:cortinaEntra .55s cubic-bezier(.76,0,.24,1) forwards}
.cortina.sai{animation:cortinaSai .55s cubic-bezier(.76,0,.24,1) forwards}
@keyframes cortinaEntra{from{transform:scaleY(0); transform-origin:bottom}to{transform:scaleY(1); transform-origin:bottom}}
@keyframes cortinaSai{from{transform:scaleY(1); transform-origin:top}to{transform:scaleY(0); transform-origin:top}}

/* ---- Currículo -------------------------------------------------------- */
.cv-barra{
  display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  margin:106px 0 26px; padding:10px 12px; border-radius:999px;
  position:sticky; top:74px; z-index:40;
  background:color-mix(in srgb, var(--base) 90%, transparent); backdrop-filter:blur(12px);
  border:1px solid color-mix(in srgb, var(--tinta) 10%, transparent);
}
@media (max-width:520px){ .cv-barra{border-radius:22px; top:70px} }
.cv-modos{display:flex; gap:8px; background:var(--sup); padding:5px; border-radius:999px}
.cv-modos button{
  padding:9px 20px; border-radius:999px; font-family:Quicksand,sans-serif; font-weight:700; font-size:15px;
  transition:background .25s, color .25s;
}
.cv-modos button[aria-pressed="true"]{background:var(--ac); color:var(--sobre-ac)}
.cv-aviso{font-size:14px; color:var(--suave); padding-bottom:20px; max-width:var(--medida)}

.cv-folha{
  background:#fff; color:#1a1a1a; width:min(820px,100%); margin:0 auto 90px;
  padding:52px 56px; border-radius:10px; box-shadow:0 26px 70px rgba(0,0,0,.25);
}
.cv-folha h1,.cv-folha h2,.cv-folha h3{color:inherit}
.cv-nome{font-size:40px; letter-spacing:-.02em; line-height:1}
.cv-cargo{font-family:Quicksand,sans-serif; font-weight:600; letter-spacing:.22em; font-size:13px; margin-top:8px}
.cv-contato{font-size:14px; margin-top:14px; color:#444}
.cv-secao{margin-top:30px}
.cv-secao > h2{font-size:15px; letter-spacing:.16em; margin-bottom:12px; font-family:Quicksand,sans-serif}
.cv-item{margin-bottom:18px; break-inside:avoid}
.cv-item h3{font-size:17px; font-family:Quicksand,sans-serif}
.cv-item .cv-linha{font-size:13.5px; color:#555; margin-bottom:6px}
.cv-item ul{margin:0; padding-left:19px; font-size:14.5px}
.cv-item ul li{margin-bottom:4px}
.cv-tags{display:flex; flex-wrap:wrap; gap:7px}
.cv-tags span{font-size:13.5px; padding:5px 12px; border-radius:999px; background:#f1eef2}

/* modelo criativo */
.cv-folha.criativo{border-top:14px solid var(--vinho-base)}
.cv-folha.criativo .cv-nome{color:var(--vinho-base); font-family:Quicksand,sans-serif}
.cv-folha.criativo .cv-cargo{color:#912049}
.cv-folha.criativo .cv-secao > h2{color:var(--vinho-base); border-bottom:2px solid #e27be6; padding-bottom:6px}
.cv-folha.criativo .cv-flor{width:54px; color:var(--vinho-base); float:right}

/* modelo ATS: uma coluna, sem cor, sem enfeite, texto selecionável */
.cv-folha.ats{
  font-family:Arial,Helvetica,sans-serif; color:#000; box-shadow:none;
  border:1px solid #ddd; border-radius:0;
}
.cv-folha.ats *{font-family:Arial,Helvetica,sans-serif !important; color:#000 !important}
.cv-folha.ats .cv-nome{font-size:26px; font-weight:bold}
.cv-folha.ats .cv-cargo{letter-spacing:0; font-size:15px; margin-top:2px}
.cv-folha.ats .cv-secao > h2{font-size:14px; letter-spacing:0; text-transform:none; border-bottom:1px solid #000; padding-bottom:3px}
.cv-folha.ats .cv-tags{display:block}
.cv-folha.ats .cv-tags span{background:none; padding:0; display:inline}
.cv-folha.ats .cv-tags span::after{content:", "}
.cv-folha.ats .cv-tags span:last-child::after{content:""}
.cv-folha.ats .cv-flor{display:none}


.pular{
  position:absolute; left:-9999px; top:10px; z-index:100;
  background:var(--ac); color:var(--sobre-ac); padding:12px 20px; border-radius:999px;
  text-decoration:none; font-family:Quicksand,sans-serif; font-weight:700;
}
.pular:focus{left:4vw}
.tema-dica{
  position:absolute; top:calc(100% + 10px); right:0;
  white-space:nowrap; background:var(--sup); color:var(--tinta); font-size:13.5px;
  font-family:Quicksand,sans-serif; font-weight:600;
  padding:7px 13px; border-radius:999px; box-shadow:0 8px 22px rgba(0,0,0,.18);
  opacity:0; pointer-events:none; transition:opacity .22s;
}
.tema:hover .tema-dica,.tema:focus-visible .tema-dica,.tema.mostra .tema-dica{opacity:1}
.chip .cont{opacity:.9; font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .cont{opacity:1}
.cartao{border:1px solid color-mix(in srgb, var(--tinta) 10%, transparent)}

/* ---- Adesivos da marca ------------------------------------------------ */
.adesivos{display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin-top:36px}
.adesivos svg{height:62px; width:auto; filter:drop-shadow(0 7px 16px rgba(0,0,0,.24));
  transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.adesivos svg:nth-child(odd){transform:rotate(-7deg)}
.adesivos svg:nth-child(even){transform:rotate(6deg)}
.adesivos svg:hover{transform:rotate(0deg) scale(1.16)}

/* ---- Antes e depois --------------------------------------------------- */
.comp-modos{display:inline-flex; gap:6px; background:var(--sup); padding:5px; border-radius:999px; margin-top:54px}
.comp-modos button{padding:9px 24px; border-radius:999px; font-family:Quicksand,sans-serif;
  font-weight:700; font-size:15px; transition:background .25s, color .25s}
.comp-modos button[aria-pressed="true"]{background:var(--ac); color:var(--sobre-ac)}
.comp-modos + .proj-galeria{margin-top:20px}

/* ---- Impressão -------------------------------------------------------- */
/* ---- Portfólio em PDF ---------------------------------------------- */
/* Página A4 deitada. Na tela, cada página é uma folha em escala; as     */
/* medidas em cqw fazem a folha da tela e a do PDF serem a mesma.        */
.pf-doc{
  --pf-vinho:#4d0012; --pf-marrom:#330d0d; --pf-rosa:#f5c5ff; --pf-azul:#c2d8f9;
  --pf-creme:#f2f2f2; --pf-ac:#a82051;
  display:grid; gap:28px; justify-items:center; padding:0 4vw 80px;
}
.pf-pag{
  page:pf; container-type:inline-size; position:relative; overflow:hidden;
  width:min(1100px, 100%); aspect-ratio:297/210; border-radius:10px;
  box-shadow:0 20px 50px -26px rgba(0,0,0,.45);
  background:var(--pf-creme); color:var(--pf-marrom);
  font-family:Karla,system-ui,sans-serif; font-size:calc(1.5cqw * var(--fs,1)); line-height:1.5;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.pf-pag h1,.pf-pag h2,.pf-pag h3{font-family:Quicksand,system-ui,sans-serif; margin:0}
.pf-pag p{margin:0 0 .9em; max-width:none}
.pf-tarja{
  display:inline-block; background:var(--pf-ac); color:var(--pf-creme);
  font-size:calc(3.4cqw * var(--fs,1)); font-weight:700; letter-spacing:-.01em; line-height:1.15;
  padding:.18em .5em .24em; border-radius:.3em; margin-bottom:.8em !important;
}
.pf-folha{position:absolute; inset:0}
.pf-logo{width:100%; height:auto; fill:currentColor; display:block}

/* capa e fim */
.pf-capa,.pf-fim{display:grid; grid-template-columns:1.4fr 1fr; align-items:center; padding:0 7cqw;
  border-bottom:2.2cqw solid var(--pf-vinho)}
.pf-capa{grid-template-columns:1fr}
.pf-capa-marca-h{width:26cqw; color:var(--pf-vinho); margin-top:6.5cqw}
.pf-sobre{font-size:calc(1.55cqw * var(--fs,1)); letter-spacing:.1em; color:var(--pf-ac); font-weight:700}
.pf-capa h1{font-size:calc(11cqw * var(--fs,1)); color:var(--pf-vinho); letter-spacing:-.04em; line-height:1; margin:.15em 0 .1em}
.pf-tipo{font-family:Quicksand,sans-serif; font-weight:700; font-size:calc(3cqw * var(--fs,1)); color:var(--pf-marrom)}
.pf-inclui{font-size:calc(2.1cqw * var(--fs,1)); color:#6b2333; letter-spacing:.01em}
.pf-capa-marca{justify-self:end; width:19cqw; color:var(--pf-vinho); text-align:center;
  font-family:Quicksand,sans-serif; font-weight:700; font-size:calc(1.6cqw * var(--fs,1))}
.pf-capa-marca span{display:block; margin-top:.8em}
.pf-fim p{font-size:calc(1.8cqw * var(--fs,1))}
.pf-contatos{list-style:none; padding:0; margin:1.4em 0 0; display:grid; gap:.6em; font-size:calc(1.6cqw * var(--fs,1)); font-weight:700}
.pf-contatos li::before{content:""; display:inline-block; width:.55em; height:.55em; border-radius:50%;
  background:var(--pf-ac); margin-right:.7em; vertical-align:middle}

/* muito prazer */
.pf-prazer{display:grid; grid-template-columns:1.3fr 1fr; grid-template-rows:minmax(0,1fr);
  background:var(--pf-marrom); color:var(--pf-creme)}
.pf-prazer .pf-col{padding:5cqw 5cqw 5cqw 7cqw; display:flex; flex-direction:column; justify-content:center; min-height:0}
.pf-servicos{list-style:none; padding:0; margin:1.6em 0 0; display:grid; gap:.5em;
  font-family:Quicksand,sans-serif; font-weight:700; color:var(--pf-rosa)}
.pf-foto{display:grid; place-items:center; padding:3cqw !important; background:#472323}
.pf-foto img{width:100%; height:100%; object-fit:contain}
.pf-flor-grande{width:55%; fill:var(--pf-rosa); opacity:.85}

/* sumário */
.pf-sumario{background:var(--pf-marrom); color:var(--pf-creme); padding:6cqw 7cqw;
  display:grid; align-content:center}
.pf-sum-grade{display:grid; grid-template-columns:repeat(2,1fr); gap:3cqw 5cqw; margin-top:1.5cqw; align-content:start}
.pf-sum-grade.c3{grid-template-columns:repeat(3,1fr); gap:2.5cqw 4cqw}
.pf-sum-grade.c4{grid-template-columns:repeat(4,1fr); gap:2.5cqw 3.4cqw}
.pf-sum-grade h3{font-size:calc(2.3cqw * var(--fs,1)); color:var(--pf-rosa); margin-bottom:.8em; line-height:1.2}
.pf-sum-grade h3 span{color:inherit}
.pf-sum-grade ul{list-style:none; padding:0; margin:0; display:grid; gap:1.3em; align-content:start}
.pf-sum-grade li strong{display:block; font-family:Quicksand,sans-serif; font-size:calc(1.85cqw * var(--fs,1)); line-height:1.25}
.pf-sum-grade li span{display:block; font-size:calc(1.35cqw * var(--fs,1)); color:#e2c3cd; margin-top:.2em}

/* divisor de eixo */
.pf-divisor{display:grid; place-items:center; background:var(--pf-rosa)}
.pf-divisor .pf-tarja{font-size:calc(5cqw * var(--fs,1)); background:var(--pf-vinho); color:var(--pf-rosa)}

/* projeto, página A */
.pf-proj{display:grid; grid-template-columns:42% 58%; grid-template-rows:minmax(0,1fr); background:var(--pf-marrom); color:var(--pf-creme)}
.pf-proj-txt{padding:5cqw 4cqw 4cqw 5.5cqw; display:flex; flex-direction:column; min-height:0}
.pf-meta{font-size:calc(1.25cqw * var(--fs,1)); letter-spacing:.14em; color:var(--pf-rosa); font-weight:700; margin-bottom:1.2em}
.pf-resumo{font-family:Quicksand,sans-serif; font-weight:600; font-size:calc(1.75cqw * var(--fs,1)); line-height:1.4; color:var(--pf-rosa)}
.pf-metricas{display:flex; flex-wrap:wrap; column-gap:1.6em; row-gap:.7em; margin:.4em 0 1.2em}
.pf-metricas > div{flex:1 1 0; min-width:0}
.pf-metricas strong{display:block; font-family:Quicksand,sans-serif; font-size:calc(2.2cqw * var(--fs,1)); color:var(--pf-rosa); white-space:nowrap}
.pf-metricas span{display:block; font-size:calc(1.2cqw * var(--fs,1)); line-height:1.3; margin-top:.3em; color:#e2c3cd}
.pf-fichas{margin-top:auto; display:grid; grid-template-columns:1fr 1fr; gap:.8em 1.4em; font-size:calc(1.3cqw * var(--fs,1));
  padding-top:1.2em; border-top:1px solid rgba(242,242,242,.25)}
.pf-fichas span{display:block; font-size:calc(1.05cqw * var(--fs,1)); letter-spacing:.12em; color:var(--pf-rosa); font-weight:700}
.pf-proj-img{background:#472323; overflow:hidden; display:grid; place-items:center; padding:3cqw}
.pf-proj-img img{width:100%; height:100%; object-fit:contain; display:block; border-radius:1cqw}

/* projeto, página B */
.pf-proj-b{padding:4cqw 5cqw; display:flex}
.pf-galeria{display:grid; gap:1.6cqw; width:100%; height:100%}
.pf-galeria.grade.n2{grid-template-columns:1fr 1fr}
.pf-galeria.grade.n3{grid-template-columns:1.4fr 1fr; grid-template-rows:1fr 1fr}
.pf-galeria.grade.n3 figure:first-child{grid-row:span 2}
.pf-galeria.grade.n4{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr}
.pf-galeria.fila{grid-auto-flow:column; grid-auto-columns:1fr; align-items:center}
/* fila de peças em pé: as imagens ficam numa linha e as legendas noutra, alinhadas
   entre si. A altura-limite é a da folha menos as margens e a legenda. */
.pf-galeria.fila{grid-template-rows:auto auto; align-content:center; align-items:end}
.pf-galeria.fila figure{display:contents}
.pf-galeria.fila img{height:auto; max-height:56cqw; min-height:0; object-fit:contain;
  align-self:end; justify-self:center; width:auto; max-width:100%}
.pf-galeria.fila img.pf-corta{width:100%; height:56cqw; object-fit:cover; object-position:top}
.pf-galeria.fila figcaption{align-self:start}
.pf-galeria figure{margin:0; display:flex; flex-direction:column; gap:.5em; min-height:0}
.pf-galeria img{flex:1; min-height:0; width:100%; object-fit:cover; border-radius:1cqw; background:none}
.pf-galeria figure.inteira img{object-fit:contain; border-radius:0}
.pf-galeria figcaption{font-size:calc(1.45cqw * var(--fs,1)); color:#6b2333; line-height:1.35}
.pf-ux{display:grid; grid-template-columns:1fr 1fr; gap:4cqw; align-items:stretch}
.pf-etapas{display:grid; gap:1.4cqw; align-content:start}
.pf-etapas span{font-family:Quicksand,sans-serif; font-weight:700; color:var(--pf-ac); font-size:calc(1.25cqw * var(--fs,1))}
.pf-etapas h3{font-size:calc(1.9cqw * var(--fs,1)); color:var(--pf-vinho); margin:.1em 0 .3em}
.pf-etapas p{font-size:calc(1.4cqw * var(--fs,1)); line-height:1.5; margin:0}
.pf-ux-imgs{display:grid; gap:1.6cqw; min-height:0}
.pf-ux-imgs figure{margin:0; min-height:0; background:#fff; border-radius:1cqw; overflow:hidden; display:grid; place-items:center}
.pf-ux-imgs img{width:100%; height:100%; object-fit:contain}

@page pf{size:A4 landscape; margin:0}
.pf-doc, .pf-doc *{page:pf}
@media print{
  body.imprimindo-pf .env{display:none}
  .pf-doc{display:block; padding:0}
  .pf-pag{width:297mm; height:210mm; aspect-ratio:auto; border-radius:0; box-shadow:none;
    break-after:page; page-break-after:always}
  .pf-pag:last-child{break-after:auto; page-break-after:auto}
}
@media (max-width:700px){
  .pf-doc{gap:16px; padding:0 3vw 60px}
  .pf-pag{border-radius:6px}
}

/* Margem da página zerada: sem espaço na margem, o navegador não imprime
   URL, data e título no cabeçalho e no rodapé. A margem real vai para dentro
   da folha e se repete em cada página. */
@page{size:A4; margin:0}
@media print{
  body{background:#fff}
  /* A folha manda, não a tela. Sem largura fixa aqui, o navegador do celular
     imprime com a largura do aparelho e o número de páginas muda. */
  html,body{width:210mm; min-width:210mm; margin:0}
  body.imprimindo-pf, html:has(body.imprimindo-pf){width:297mm; min-width:297mm}
  .env{max-width:none; width:100%; padding:0}
  .topo,.gaveta,.tema,.lupa,.cv-barra,.cv-aviso,.rodape,.cortina{display:none !important}
  .cv-folha{box-shadow:none; border:none; margin:0; padding:14mm; width:210mm; border-radius:0;
    -webkit-box-decoration-break:clone; box-decoration-break:clone}
  .cv-folha.criativo{border-top:10px solid var(--vinho-base)}
  .cv-item{page-break-inside:avoid}
}

/* ---- Telas menores ---------------------------------------------------- */
@media (max-width:900px){
  .nav-desk{display:none}
  .idioma{display:none}
  .gaveta-idioma{display:inline-flex}
  .sanduiche{display:grid}
  .ades:nth-child(5),.ades:nth-child(6),.ades:nth-child(7){display:none}
  .capa{padding:110px 0 70px}
  .sobre-grade{grid-template-columns:1fr; gap:32px}
  .contato-grade{grid-template-columns:1fr; gap:38px}
  .gal-grupo{--gap:14px}
  .gal-grupo.f-dupla{--kk:1}
  .gal-grupo.f-tripla,.gal-grupo.f-retrato,.gal-grupo.f-post{--kk:2}
  .galeria{gap:20px}
  .secao-cab{grid-template-columns:1fr; gap:14px}
  .intro-grade{grid-template-columns:1fr; gap:30px}
  .intro-grade .proj-fichas{display:flex; flex-wrap:wrap; gap:18px 28px; padding-left:0; border-left:0;
    padding-top:22px; border-top:1px solid color-mix(in srgb,var(--tinta) 16%,transparent)}
  .indice{top:76px}
  .proximo-card{grid-template-columns:1fr}
  .secao-case{padding:64px 0}
  .lupa{padding:80px 3vw}
  .lupa-btn{width:44px; height:44px}
  .grade{grid-template-columns:1fr}
  .cartao.largo{grid-column:span 1}
  .cartao.solto{grid-column:span 1; width:100%}
  .cv-folha{padding:32px 26px}
  .tom{padding:76px 0}
  section{padding:66px 0}
}
@media (max-width:520px){
  .ades:nth-child(2),.ades:nth-child(4){opacity:.85}
  .capa-frase{font-size:16.5px}

  .baixar-menu{position:fixed; right:4vw; left:4vw; width:auto}
  .proj-fichas{gap:22px}
  .ades{--esc:.44}
  .fita-fila{gap:18px}
  .fita-fila span{font-size:13px}
  .filtros{gap:7px; margin-bottom:30px}
  .chip{padding:6px 13px; font-size:13px; line-height:1.2; min-height:36px; border-width:1.5px}
  .chip small{font-size:9.5px; letter-spacing:.04em; margin-top:1px}
}

/* ---- Respeito a quem prefere menos movimento -------------------------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
  .reveal{opacity:1; transform:none}
  .fita-fila{animation:none}
  .ades-flt{animation:none}
  html{scroll-behavior:auto}
}
</style>

  };

  /* ---- idioma ---------------------------------------------------------- */
  /* Na primeira visita segue o idioma do navegador; depois, a escolha da pessoa. */
  function idiomaInicial(){
    try { const g = localStorage.getItem("idioma"); if (g === "pt" || g === "en") return g; } catch(e){}
    return (navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en";
  }
  let LANG = idiomaInicial();
  let C = LANG === "en" ? CONTEUDO_EN : CONTEUDO;
  const T = k => (TEXTOS[LANG] && TEXTOS[LANG][k]) || TEXTOS.pt[k] || "";

  function aplicarIdioma(){
    C = LANG === "en" ? CONTEUDO_EN : CONTEUDO;
    document.documentElement.lang = LANG === "en" ? "en" : "pt-BR";
    document.title = C.marca.nome + " · " + C.marca.cargo;
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.setAttribute("content", LANG === "en"
      ? "Portfolio of Gio Ribeiro, visual designer. Brand identity, editorial design, UX/UI and social media."
      : "Portfólio de Gio Ribeiro, visual designer. Identidade visual, diagramação, UX/UI e social media.");
    document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));
    document.querySelectorAll("[data-t-aria]").forEach(el => el.setAttribute("aria-label", T(el.dataset.tAria)));
    document.querySelectorAll("#baixarMenu strong").forEach(el => el.dataset.aberto = T("menu.aberto"));
  }

  function trocarIdioma(){
    LANG = LANG === "pt" ? "en" : "pt";
    try { localStorage.setItem("idioma", LANG); } catch(e){}
    aplicarIdioma();
    navegar();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  const POSICOES = [
    {lado:"esq", x:"6%",  y:"15%", tam:120, rot:"-12deg", dur:"7.5s",  atraso:".55s", mob:true,  ym:"6%"},
    {lado:"dir", x:"28%", y:"10%", tam:106, rot:"11deg",  dur:"8.5s",  atraso:".70s", mob:true,  ym:"5%"},
    {lado:"esq", x:"30%", y:"45%", tam:86,  rot:"15deg",  dur:"6.8s",  atraso:".85s", mob:false},
    {lado:"dir", x:"8%",  y:"38%", tam:92,  rot:"-9deg",  dur:"9.2s",  atraso:"1s",   mob:false},
    {lado:"esq", x:"5%",  y:"70%", tam:100, rot:"7deg",   dur:"7.9s",  atraso:"1.15s", mob:true, ym:"76%"},
    {lado:"dir", x:"32%", y:"62%", tam:124, rot:"-15deg", dur:"8.1s",  atraso:"1.3s", mob:false},
    {lado:"dir", x:"10%", y:"82%", tam:88,  rot:"6deg",   dur:"7.2s",  atraso:"1.45s", mob:false},
  ];
  const ADESIVOS = [[1, "0 0 231.72 231.72", 0.9, "11%", "6%", "clamp(66px,9vw,130px)", "-6deg", "7.5s"], [2, "0 0 136.73 106.52", 0.6, "63%", "9%", "clamp(54px,7vw,102px)", "5deg", "8.4s"], [3, "0 0 174.4 167.13", 0.8, "15%", "79%", "clamp(58px,8vw,114px)", "7deg", "6.8s"], [4, "0 0 225.33 223.63", 0.5, "65%", "77%", "clamp(62px,8.5vw,122px)", "-5deg", "9.1s"], [5, "0 0 145.07 164.72", 1.2, "42%", "3%", "clamp(38px,5vw,72px)", "9deg", "6.2s"], [6, "0 0 204.34 252.66", 1.1, "9%", "63%", "clamp(42px,5.5vw,80px)", "-8deg", "7.9s"], [7, "0 0 144.14 126.18", 1.3, "78%", "85%", "clamp(40px,5vw,76px)", "6deg", "5.9s"]];
  const app = document.getElementById("app");
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const eixoDe = id => C.eixos.find(e => e.id === id) || {nome:"", grupo:""};
  const flor = cls => '<svg class="'+cls+'" viewBox="0 0 120.68 119.77" aria-hidden="true"><use href="#flor"></use></svg>';

  /* ---- tema ----------------------------------------------------------- */
  const temas = ["claro","vinho","rosa","azul","carvao"];
  let tema = 0;
  const dica = document.getElementById("temaDica");
  document.getElementById("btnTema").addEventListener("click", () => {
    tema = (tema + 1) % temas.length;
    document.body.dataset.tema = temas[tema];
    dica.textContent = T("corDoSite") + T("tema." + temas[tema]);
    const bt = document.getElementById("btnTema");
    bt.classList.add("mostra");
    clearTimeout(bt._t); bt._t = setTimeout(() => bt.classList.remove("mostra"), 1800);
  });

  /* ---- menu ----------------------------------------------------------- */
  const sand = document.getElementById("sanduiche");
  sand.addEventListener("click", () => {
    const on = document.body.classList.toggle("menu-on");
    sand.setAttribute("aria-expanded", on);
    sand.setAttribute("aria-label", on ? T("menu.fechar") : T("menu.abrir"));
  });
  document.getElementById("gaveta").addEventListener("click", e => {
    if (e.target.tagName === "A") { document.body.classList.remove("menu-on"); sand.setAttribute("aria-expanded","false"); }
  });

  /* ---- menu de download ------------------------------------------------ */
  const cxBaixar = document.getElementById("baixar");
  const btBaixar = document.getElementById("btnBaixar");
  btBaixar.addEventListener("click", e => {
    e.stopPropagation();
    const on = cxBaixar.classList.toggle("aberto");
    btBaixar.setAttribute("aria-expanded", on);
  });
  document.addEventListener("click", e => {
    if (!cxBaixar.contains(e.target)) { cxBaixar.classList.remove("aberto"); btBaixar.setAttribute("aria-expanded","false"); }
  });

  /* Estando na página do documento, o item do menu dispara o download em vez
     de recarregar a mesma tela. Sem isso, o botão do topo parece quebrado. */
  document.querySelectorAll("#baixarMenu a").forEach(a => {
    a.addEventListener("click", e => {
      if (a.getAttribute("href") !== location.hash) return;
      e.preventDefault();
      cxBaixar.classList.remove("aberto");
      btBaixar.setAttribute("aria-expanded", "false");
      const bt = document.getElementById("btnImprimir") || document.getElementById("btnImprimirPf");
      if (bt) bt.click();
    });
  });

  /* Marca no menu qual documento está aberto. */
  function marcarMenu(){
    document.querySelectorAll("#baixarMenu a").forEach(a => {
      const aqui = a.getAttribute("href") === location.hash;
      a.toggleAttribute("aria-current", aqui);
      const forte = a.querySelector("strong");
      if (forte) forte.dataset.aberto = T("menu.aberto");
    });
  }
  window.addEventListener("hashchange", marcarMenu);
  marcarMenu();

  /* ---- revelação ao rolar ---------------------------------------------- */
  let observador;
  function observar(){
    if (observador) observador.disconnect();
    observador = new IntersectionObserver(entradas => {
      entradas.forEach(en => { if (en.isIntersecting){ en.target.classList.add("revelado"); observador.unobserve(en.target); } });
    }, {threshold:.15, rootMargin:"0px 0px -60px"});
    document.querySelectorAll(".reveal").forEach(el => observador.observe(el));
  }

  window.addEventListener("scroll", () => {
    document.querySelector(".topo").classList.toggle("rolou", window.scrollY > 12);
  }, {passive:true});

  /* ---- blocos de página ------------------------------------------------ */
  /* ---- adesivos arrastáveis -------------------------------------------- */
  function ativarArrasto(){
    document.querySelectorAll(".ades").forEach(el => {
      let ox=0, oy=0, bx=0, by=0, ativo=false;
      el.addEventListener("pointerdown", e => {
        ativo = true; el.classList.add("arrastando");
        el.setPointerCapture(e.pointerId);
        ox = e.clientX; oy = e.clientY;
        bx = parseFloat(el.style.getPropertyValue("--dx")) || 0;
        by = parseFloat(el.style.getPropertyValue("--dy")) || 0;
        e.preventDefault();
      });
      el.addEventListener("pointermove", e => {
        if (!ativo) return;
        el.style.setProperty("--dx", (bx + e.clientX - ox) + "px");
        el.style.setProperty("--dy", (by + e.clientY - oy) + "px");
      });
      const soltar = () => { ativo = false; el.classList.remove("arrastando"); };
      el.addEventListener("pointerup", soltar);
      el.addEventListener("pointercancel", soltar);
    });
  }

  function blocoCapa(){
    const umAdesivo = (a, p) => `<div class="ades${p.mob ? "" : " so-desk"}"
        style="--x:${p.x}; --y:${p.y}; --ym:${p.ym || p.y}; --tam:${p.tam}px;
        --rot:${p.rot}; --dur:${p.dur}; --atraso:${p.atraso}">
        <div class="ades-ent"><div class="ades-flt">
          <svg viewBox="${a[1]}" aria-hidden="true"><use href="#stk-${a[0]}"></use></svg>
        </div></div>
      </div>`;
    const faixa = lado => ADESIVOS
      .map((a,i) => [a, POSICOES[i]])
      .filter(([,p]) => p.lado === lado)
      .map(([a,p]) => umAdesivo(a,p)).join("");
    const ad = `<div class="ades-faixa esq">${faixa("esq")}</div>
                <div class="ades-faixa dir">${faixa("dir")}</div>`;

    const fita = C.eixos.map(e =>
      `<span>${esc(e.nome)}</span><svg class="fita-flor" viewBox="0 0 120.68 119.77" aria-hidden="true"><use href="#flor"></use></svg>`
    ).join("");

    return `
    <section class="capa">
      <div class="capa-ades" aria-hidden="true">${ad}</div>
      <div class="env capa-centro">
        <p class="capa-dica subir">${esc(T("capa.dica"))}</p>
        <div class="capa-flor anim-flor">${flor("marca-svg")}</div>
        <h1 class="subir d1">${esc(C.marca.nome)}</h1>
        <p class="capa-cargo subir d2">${esc(C.marca.cargo)}</p>
        <div class="capa-cta subir d3">
          <a class="btn btn-cheio" href="#/#trabalhos">${esc(T("capa.ver"))}</a>
          <a class="btn btn-vazio" href="#/#contato">${esc(T("capa.falar"))}</a>
        </div>
      </div>
      <div class="fita" aria-hidden="true"><div class="fita-fila">${fita}${fita}</div></div>
    </section>`;
  }

  function blocoTrabalhos(){
    const conta = id => C.projetos.filter(p => p.eixo === id).length;
    const chips = [`<button class="chip" data-eixo="todos" aria-pressed="true">${esc(T("trabalhos.todos"))} <span class="cont">${C.projetos.length}</span></button>`]
      .concat(C.eixos.map(e => `<button class="chip" data-eixo="${esc(e.id)}" aria-pressed="false">${esc(e.nome)} <span class="cont">${conta(e.id)}</span>${e.grupo?`<small>${esc(e.grupo)}</small>`:""}</button>`))
      .join("");
    return `
    <section id="trabalhos">
      <div class="env">
        <div class="reveal">
          <h2 class="secao-titulo">${esc(T("trabalhos.titulo"))}</h2>
          <div class="secao-linha"></div>
        </div>
        <div class="filtros reveal" id="filtros">${chips}</div>
        <div class="grade" id="grade"></div>
      </div>
    </section>`;
  }

  function cartao(p){
    const e = eixoDe(p.eixo);
    const capa = p.capa
      ? `<img src="${esc(p.capa)}" alt="${esc(p.titulo)}" loading="lazy"
             style="object-position:${esc(p.capaFoco || "center")}" onerror="this.remove()">`
      : "";
    return `
    <a class="cartao reveal ${p.destaque ? "largo":""}${p.solto ? " solto":""}" href="#/projeto/${esc(p.id)}">
      <div class="cartao-img">${capa || flor("flor-fundo")}</div>
      <div class="cartao-txt">
        <div class="cartao-meta"><span>${esc(e.nome)}</span><span>·</span><span>${esc(p.ano)}</span></div>
        <h3>${esc(p.titulo)}</h3>
        <p>${esc(p.resumo)}</p>
      </div>

  /* Evita card sozinho na linha. Quando um card normal ficaria sem par
     (porque o próximo é destaque ou a lista acabou), puxa para o lado dele
     o próximo card normal da lista. Se não sobrar nenhum, ele fica centralizado
     (classe "solto"), no tamanho de sempre, para a capa não ser cortada em 21:9.
     Funciona em todos os filtros e continua valendo quando entram projetos novos. */
  function semBuracos(lista){
    const fila = lista.slice(), saida = [];
    while (fila.length){
      const p = fila.shift();
      if (p.destaque){ saida.push(p); continue; }
      if (fila.length && !fila[0].destaque){ saida.push(p, fila.shift()); continue; }
      const i = fila.findIndex(q => !q.destaque);
      if (i >= 0){ saida.push(p, fila.splice(i,1)[0]); }
      else { saida.push(Object.assign({}, p, {solto:true})); }
    }
    return saida;
  }

  /* ---- envio do formulário ---------------------------------------------- */
  function ligarFormulario(){
    const f = document.getElementById("formContato");
    if (!f) return;
    const aviso = document.getElementById("formAviso");
    const botao = document.getElementById("fEnviar");
    f.addEventListener("submit", async e => {
      e.preventDefault();
      if (!f.checkValidity()) {
        aviso.className = "form-aviso erro";
        aviso.textContent = T("form.obrigatorio");
        f.reportValidity(); return;
      }
      /* "netlify" usa a detecção automática da Netlify; qualquer outro valor é um
         endereço que recebe a mensagem em JSON — um serviço externo
         (https://formspree.io/f/...) ou uma função do próprio site (/api/contato). */
      const destino = (C.contato.formulario && C.contato.formulario.destino) || "netlify";
      const netlify = destino === "netlify";
      const dados = {
        "form-name": "contato", nome: f.nome.value, email: f.email.value,
        mensagem: f.mensagem.value, "bot-field": f["bot-field"].value,
      };
      botao.disabled = true;
      aviso.className = "form-aviso";
      aviso.textContent = T("form.enviando");
      try {
        const r = await fetch(netlify ? "/" : destino, netlify
          ? { method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body: new URLSearchParams(dados).toString() }
          : { method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body: JSON.stringify(dados) });
        if (!r.ok) throw new Error(r.status);
        f.reset();
        aviso.className = "form-aviso ok";
        aviso.textContent = T("form.ok");
      } catch (err) {
        aviso.className = "form-aviso erro";
        aviso.innerHTML = T("form.erro") +
          `<a href="mailto:${esc(C.contato.email)}">${esc(C.contato.email)}</a>.`;
      } finally {
        botao.disabled = false;
      }
    });
  }

  /* ---- galeria: aceita "caminho.jpg" ou {src, formato, legenda} --------- */
  const FORMATOS = ["cheia","sangria","dupla","tripla","retrato","post"];
  function normImg(it){
    const o = (typeof it === "string") ? { src: it } : Object.assign({}, it);
    if (FORMATOS.indexOf(o.formato) < 0) o.formato = "cheia";
    return o;
  }
  /* ---- etapas: metodologia em HTML, responsiva e editável --------------- */
  /* Contraste WCAG: escolhe o texto (claro ou escuro) que dá mais contraste
     com a cor do disco. Se nem assim chega a 4.5:1, escurece ou clareia a
     cor do disco aos poucos, mantendo o tom, até passar. */
  const TXT_CLARO = "#f2f2f2", TXT_ESCURO = "#330d0d";
  function rgbDe(hex){
    const c = (hex || "#888").replace("#","");
    const v = c.length === 3 ? c.split("").map(x => x + x).join("") : c;
    return [0,2,4].map(i => parseInt(v.slice(i,i+2),16));
  }
  function luminancia(rgb){
    const n = rgb.map(x => x / 255).map(x => x <= .03928 ? x/12.92 : Math.pow((x+.055)/1.055, 2.4));
    return .2126*n[0] + .7152*n[1] + .0722*n[2];
  }
  function contraste(a, b){
    const la = luminancia(a), lb = luminancia(b);
    return (Math.max(la,lb) + .05) / (Math.min(la,lb) + .05);
  }
  function hexDe(rgb){ return "#" + rgb.map(x => Math.round(x).toString(16).padStart(2,"0")).join(""); }
  function corAcessivel(hex){
    let rgb = rgbDe(hex);
    const claro = rgbDe(TXT_CLARO), escuro = rgbDe(TXT_ESCURO);
    const usarClaro = contraste(rgb, claro) >= contraste(rgb, escuro);
    const txt = usarClaro ? claro : escuro;
    let passos = 0;
    while (contraste(rgb, txt) < 4.5 && passos < 40) {
      rgb = usarClaro ? rgb.map(x => x * .95) : rgb.map(x => x + (255 - x) * .08);
      passos++;
    }
    return { fundo: hexDe(rgb), texto: usarClaro ? TXT_CLARO : TXT_ESCURO };
  }
  function blocoEtapas(b){
    return `<ol class="etapas">${b.etapas.map((et,i) => `
      <li class="etapa">
        <div class="etapa-disco" style="background:${corAcessivel(et.cor || "#a82051").fundo}; color:${corAcessivel(et.cor || "#a82051").texto}">
          <span class="etapa-num">${String(i+1).padStart(2,"0")}</span>
          <span class="etapa-nome">${esc(et.nome)}</span>
        </div>
        ${et.texto ? `<p class="etapa-txt">${esc(et.texto)}</p>` : ""}
      </li>`).join("")}</ol>`;
  }

  /* ---- fluxo: mapa de telas, responsivo e editável ---------------------- */
  function blocoFluxo(b){
    return `<div class="fluxo">${b.fluxo.map(g => `
      <div class="fluxo-col">
        <h3 class="fluxo-grupo">${esc(g.grupo)}</h3>
        <ul class="fluxo-passos">${g.passos.map(pa => `<li>${esc(pa)}</li>`).join("")}</ul>
      </div>`).join("")}</div>`;
  }

  /* ---- textos: "ESCREVA AQUI" some do site publicado ------------------- */
  /* Aberto direto do computador (file://), aparece destacado para você ver */
  /* o que falta. Publicado, simplesmente não aparece.                      */
  const RASCUNHO = location.protocol === "file:" || /[?&]rascunho\b/.test(location.search);
  const pendente = t => /^\s*ESCREVA AQUI/i.test(t || "");
  function textos(lista){
    return (lista || []).filter(t => t && (RASCUNHO || !pendente(t)));
  }
  function paragrafos(lista){
    return textos(lista).map(t =>
      `<p${pendente(t) ? ' class="pendente"' : ""}>${esc(t)}</p>`).join("");
  }

  /* ---- galeria: imagens seguidas do mesmo formato viram um grupo -------- */
  /* O número de colunas sai da quantidade: 4 posts ficam 4 por linha,      */
  /* 5 ficam 3 + 2 centralizados, 1 fica centralizado. Nada fica órfão.     */
  function colunas(formato, n){
    if (formato === "cheia" || formato === "sangria") return 1;
    if (formato === "dupla") return 2;
    if (n <= 3) return 3;
    if (n % 4 === 0 && n % 3 !== 0) return 4;
    if (n % 3 === 1) return 4;              /* 7 → 4 + 3, em vez de 3 + 3 + 1 */
    return 3;
  }
  function galeria(lista, alt){
    const itens = (lista || []).map(normImg).filter(i => i.src);
    if (!itens.length) return "";
    const grupos = [];
    itens.forEach(im => {
      const ult = grupos[grupos.length - 1];
      if (ult && ult.formato === im.formato) ult.itens.push(im);
      else grupos.push({ formato: im.formato, itens: [im] });
    });
    const fig = im => `
      <figure class="gal-item">
        <img src="${esc(im.src)}" alt="${esc(im.legenda || alt || "")}" loading="lazy"${im.foco ? ` style="object-position:${esc(im.foco)}"` : ""}
             data-zoom="${esc(im.src)}" data-leg="${esc(im.legenda || "")}"
             onerror="this.closest('figure').style.display='none'">
        ${im.legenda ? `<figcaption>${esc(im.legenda)}</figcaption>` : ""}
      </figure>`;
    return `<div class="galeria">${grupos.map(g => `
      <div class="gal-grupo f-${g.formato}" style="--k:${colunas(g.formato, g.itens.length)}">
        ${g.itens.map(fig).join("")}
      </div>`).join("")}</div>`;
  }

  /* ---- uma seção do case ------------------------------------------------ */
  function secaoHTML(s, i, p, tom){
    const temComp = !!(s.antes && s.depois);
    const txt = paragrafos(s.texto);
    const lista = textos(s.lista);
    const alt = p.titulo + ": " + s.titulo;
    const corpo = [
      txt,
      lista.length ? `<ul class="bloco-lista">${lista.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : "",
    ].join("");
    const visual = [
      (s.etapas && s.etapas.length) ? blocoEtapas(s) : "",
      (s.fluxo && s.fluxo.length) ? blocoFluxo(s) : "",
      temComp ? `
        <div class="comp-modos" data-comp="${i}">
          <button data-fase="antes" aria-pressed="false">${esc(T("proj.antes"))}</button>
          <button data-fase="depois" aria-pressed="true">${esc(T("proj.depois"))}</button>
        </div>
        <div class="comp-gal" id="compGal${i}">${galeria(s.depois, alt)}</div>` : "",
      galeria(s.imagens, alt),
    ].join("");
    if (!corpo.trim() && !visual.trim()) return "";
    return `
    <section class="secao-case ${tom}" id="sec-${i}" data-sec="${i}">
      <div class="env">
        <div class="secao-cab reveal">
          <div class="secao-rot">
            <span class="bloco-num">${String(i + 1).padStart(2, "0")}</span>
            <h2>${esc(s.titulo)}</h2>
          </div>
          <div class="secao-txt">${corpo}</div>
        </div>
        ${visual ? `<div class="secao-visual reveal">${visual}</div>` : ""}
      </div>
    </section>`;
  }

  function paginaProjeto(id){
    const p = C.projetos.find(x => x.id === id);
    if (!p) { location.hash = "#/"; return; }
    const e = eixoDe(p.eixo);

    /* compatibilidade: aceita o formato antigo (blocos / descricao + imagens) */
    let secoes = p.secoes || p.blocos;
    let intro = p.introducao;
    if (!secoes) {
      secoes = [];
      if (p.antes && p.depois) secoes.push({ titulo: T("proj.antesDepois"), antes: p.antes, depois: p.depois });
      if (p.imagens && p.imagens.length) secoes.push({ titulo: T("proj.oProjeto"), imagens: p.imagens });
      if (!intro) intro = p.descricao;
    }

    /* ficha técnica: só entra o que o projeto tiver preenchido */
    const fichas = [
      [T("ficha.cliente"), p.cliente], [T("ficha.papel"), p.papel], [T("ficha.ano"), p.ano],
      [T("ficha.duracao"), p.duracao], [T("ficha.equipe"), p.equipe],
      [T("ficha.ferramentas"), (p.ferramentas || []).join(", ")],
    ].filter(f => f[1])
     .map(f => `<div class="ficha"><span>${esc(f[0])}</span><strong>${esc(f[1])}</strong></div>`).join("");

    const metricas = (p.metricas && p.metricas.length)
      ? `<div class="metricas reveal">${p.metricas.map(m =>
          `<div><strong>${esc(m.valor)}</strong><span>${esc(m.rotulo)}</span></div>`).join("")}</div>`
      : "";

    /* abertura: sempre 16:9 de ponta a ponta. Sem "abertura", usa a capa. */
    const aberturaSrc = p.abertura || p.capa || "";
    const abertura = aberturaSrc ? `
      <figure class="abertura${p.abertura ? "" : " provisoria"}">
        <img src="${esc(aberturaSrc)}" alt="${esc(p.titulo)}"
             style="object-position:${esc(p.aberturaFoco || p.capaFoco || "center")}"
             onload="if(!${p.abertura ? "true" : "false"} && this.naturalWidth/this.naturalHeight < 1.3) this.parentNode.classList.add('contida')"
             onerror="this.parentNode.remove()">
      </figure>` : "";

    /* seções com faixas de cor alternadas */
    const TONS = ["tom-base", "tom-b", "tom-base", "tom-a"];
    const htmlSecoes = [];
    let ultimoTom = "tom-base";
    secoes.forEach((s, i) => {
      const tom = TONS[i % TONS.length];
      const h = secaoHTML(s, i, p, tom);
      if (h) { htmlSecoes.push({ i, titulo: s.titulo, h }); ultimoTom = tom; }
    });

    const indice = htmlSecoes.length >= 3 ? `
      <nav class="indice" aria-label="${esc(T("proj.indice"))}">
        <div class="env indice-fila">
          ${htmlSecoes.map(x => `<a href="#sec-${x.i}" data-alvo="${x.i}">${esc(x.titulo)}</a>`).join("")}
        </div>
      </nav>` : "";

    const aprendList = textos(p.aprendizados);
    const tomAprend = ultimoTom === "tom-a" ? "tom-b" : "tom-a";
    const aprendizados = aprendList.length
      ? `<section class="tom ${tomAprend} aprendi">
           <div class="env reveal">
             <h2 class="secao-titulo">${esc(T("proj.aprendizados"))}</h2>
             <div class="secao-linha"></div>
             <ul>${aprendList.map(a => `<li${pendente(a) ? ' class="pendente"' : ""}>${esc(a)}</li>`).join("")}</ul>
           </div>
         </section>`
      : "";

    /* próximo projeto: o seguinte do mesmo eixo; se for o único, o seguinte da lista */
    const irmaos = C.projetos.filter(x => x.eixo === p.eixo);
    let prox = irmaos[(irmaos.indexOf(p) + 1) % irmaos.length];
    if (!prox || prox.id === p.id) prox = C.projetos[(C.projetos.indexOf(p) + 1) % C.projetos.length];
    const pe = eixoDe(prox.eixo);
    const proximo = `
      <section class="proximo-sec">
        <div class="env">
          <a class="proximo-card reveal" href="#/projeto/${esc(prox.id)}">
            <div class="proximo-img">${prox.capa
              ? `<img src="${esc(prox.capa)}" alt="" loading="lazy" style="object-position:${esc(prox.capaFoco || "center")}" onerror="this.remove()">`
              : flor("flor-fundo")}</div>
            <div class="proximo-txt">
              <span>${esc(T("proj.proximo") + pe.nome)}</span>
              <strong>${esc(prox.titulo)} →</strong>
              <p>${esc(prox.resumo)}</p>
            </div>
          </a>
          <a class="voltar todos" href="#/#trabalhos">${esc(T("proj.verTodos"))}</a>
        </div>
      </section>`;

    const introHTML = paragrafos(intro);

    app.innerHTML = `
      <section class="proj-topo">
        <div class="env">
          <a class="voltar" href="#/#trabalhos">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            ${esc(T("proj.voltar"))}
          </a>
          <div class="cartao-meta proj-meta"><span>${esc(e.nome)}</span><span>·</span><span>${esc(p.ano)}</span></div>
          <h1 class="proj-titulo">${esc(p.titulo)}</h1>
          <p class="proj-resumo">${esc(p.resumo)}</p>
        </div>
      </section>
      ${abertura}
      <section class="proj-intro">
        <div class="env">
          <div class="intro-grade${introHTML ? "" : " sem-texto"} reveal">
            ${introHTML ? `<div class="intro-txt">${introHTML}</div>` : ""}
            <div class="proj-fichas">${fichas}</div>
          </div>
          ${metricas}
        </div>
      </section>
      ${indice}
      <div class="secoes">${htmlSecoes.map(x => x.h).join("")}</div>
      ${aprendizados}
      ${proximo}
      ${blocoContato()}${blocoRodape()}`;

    ligarFormulario();

    /* comparadores antes/depois */
    document.querySelectorAll("[data-comp]").forEach(box => {
      const s = secoes[+box.dataset.comp];
      box.addEventListener("click", ev => {
        const b = ev.target.closest("button"); if (!b) return;
        box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
        document.getElementById("compGal" + box.dataset.comp).innerHTML =
          galeria(s[b.dataset.fase], p.titulo + ": " + s.titulo);
      });
    });

    /* índice: marca a seção que está na tela */
    const links = document.querySelectorAll(".indice a");
    if (links.length && "IntersectionObserver" in window) {
      const io = new IntersectionObserver(ents => {
        ents.forEach(en => {
          if (!en.isIntersecting) return;
          links.forEach(a => {
            const on = a.dataset.alvo === en.target.dataset.sec;
            a.classList.toggle("ativo", on);
            if (on) {
              const fila = a.parentNode;
              fila.scrollTo({ left: a.offsetLeft - fila.clientWidth / 2 + a.offsetWidth / 2, behavior: "smooth" });
            }
          });
        });
      }, { rootMargin: "-45% 0px -50% 0px" });
      document.querySelectorAll(".secao-case").forEach(s => io.observe(s));
    }
    document.querySelectorAll(".indice a").forEach(a => a.addEventListener("click", ev => {
      ev.preventDefault();
      document.getElementById("sec-" + a.dataset.alvo).scrollIntoView({ behavior: "smooth" });
    }));
  }

            <div class="cv-item">
              <h3>${esc(x.cargo)}</h3>
              <div class="cv-linha">${esc(x.empresa)} · ${esc(x.periodo)}${x.local ? " · " + esc(x.local) : ""}</div>
              <ul>${x.itens.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
            </div>`).join("")}
        </div>

        <div class="cv-secao">
          <h2>${esc(T("cv.formacao"))}</h2>
          ${cv.formacao.map(f => `
            <div class="cv-item">
              <h3>${esc(f.curso)}</h3>
              <div class="cv-linha">${esc(f.instituicao)} · ${esc(f.periodo)}</div>
            </div>`).join("")}
        </div>

        ${cv.cursos && cv.cursos.length ? `
        <div class="cv-secao">
          <h2>${esc(T("cv.cursos"))}</h2>
          ${cv.cursos.map(f => `<div class="cv-item"><div class="cv-linha">${esc(f.nome)} · ${esc(f.instituicao)} · ${esc(f.ano)}</div></div>`).join("")}
        </div>` : ""}

        <div class="cv-secao">
          <h2>${esc(T("cv.habilidades"))}</h2>
          <div class="cv-tags">${cv.habilidades.map(h => `<span>${esc(h)}</span>`).join("")}</div>
        </div>

        <div class="cv-secao">
          <h2>${esc(T("cv.idiomas"))}</h2>
          <div class="cv-tags">${cv.idiomas.map(i => `<span>${esc(i.idioma)}: ${esc(i.nivel)}</span>`).join("")}</div>
        </div>
      </div>`;

    app.innerHTML = `
      <div class="env">
        <div class="cv-barra">
          <div class="cv-modos">
            <button data-modelo="criativo" aria-pressed="${criativo}">${esc(T("cv.criativo"))}</button>
            <button data-modelo="ats" aria-pressed="${!criativo}">${esc(T("cv.ats"))}</button>
          </div>
          <button class="btn btn-cheio" id="btnImprimir">${esc(T("cv.baixar"))}</button>
        </div>
        <p class="cv-aviso">${esc(T(criativo ? "cv.avisoCriativo" : "cv.avisoAts"))}</p>
        ${folha}
      </div>`;

    app.querySelector(".cv-modos").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      location.hash = "#/curriculo/" + b.dataset.modelo;
    });
    document.getElementById("btnImprimir").addEventListener("click", () => {
      /* o navegador sugere o <title> como nome do arquivo ao salvar em PDF */
      const antes = document.title;
      document.title = T("cv.arquivo") + nomeCV + " - " + T(criativo ? "cv.criativo" : "cv.ats");
      window.print();
      setTimeout(() => { document.title = antes; }, 600);
    });
  }

  /* ======================================================================
     PORTFÓLIO EM PDF
     Duas versões montadas a partir dos mesmos projetos do site. Editou um
     projeto no site, o PDF sai atualizado na próxima vez que você gerar.
     ====================================================================== */
  function imagensDoProjeto(p){
    const todas = [];
    (p.secoes || p.blocos || []).forEach(s =>
      (s.imagens || s.depois || []).forEach(i => todas.push(normImg(i))));
    return todas.filter(i => i.src);
  }

  function caberNaPagina(){
    const blocos = ".pf-proj-txt,.pf-col,.pf-sum-grade,.pf-etapas,.pf-capa-txt";
    document.querySelectorAll("#pfDoc .pf-folha").forEach(pag => {
      const folga = e => e.scrollHeight - e.clientHeight;
      const cabe = () => folga(pag) <= 1 &&
        [...pag.querySelectorAll(blocos)].every(e => folga(e) <= 1);
      let fs = 1;
      pag.style.removeProperty("--fs");
      while (fs > 0.75 && !cabe()){ fs -= 0.04; pag.style.setProperty("--fs", fs.toFixed(2)); }
    });
  }

  function paginaPortfolio(tipo){
    const PF = C.portfolios || {};
    const cfg = PF[tipo] || PF.grafico;
    tipo = PF[tipo] ? tipo : "grafico";
    const nomePF = (C.curriculo && C.curriculo.nome) || C.marca.nome;
    const c = C.contato;
    const ano = new Date().getFullYear();

    const eixosPF = cfg.eixos.map(id => ({ eixo: eixoDe(id), id,
      projetos: C.projetos.filter(p => p.eixo === id && p.pdf !== false) }))
      .filter(g => g.projetos.length);

    const logo = `<svg class="pf-logo" viewBox="0 0 188.78 196.39" role="img" aria-label="${esc(C.marca.nome)}"><use href="#logo-v"></use></svg>`;
    const logoH = `<svg class="pf-logo" viewBox="0 0 333.98 122.6" role="img" aria-label="${esc(C.marca.nome)}"><use href="#logo-h"></use></svg>`;
    /* cada folha tem uma camada interna de altura fixa: é ela que dá altura
       definida às colunas, para nada escorrer para fora da página */
    const pag = (cls, html) => `<section class="pf-pag"><div class="pf-folha ${cls}">${html}</div></section>`;

    /* 1. capa */
    const capa = pag("pf-capa", `
      <div class="pf-capa-txt">
        <span class="pf-sobre">${esc(C.marca.nome)} · ${esc(C.marca.cargo)} · ${ano}</span>
        <h1>${esc(T("pf.portfolio"))}</h1>
        <p class="pf-tipo">${esc(cfg.titulo)}</p>
        <p class="pf-inclui">${esc(eixosPF.map(g => g.eixo.nome).join(" · "))}</p>
        <div class="pf-capa-marca-h">${logoH}</div>
      </div>`);

    /* 2. muito prazer */
    const s = C.sobre;
    const prazer = pag("pf-prazer", `
      <div class="pf-col">
        <h2 class="pf-tarja">${esc(s.titulo)}</h2>
        ${(s.paragrafos || []).map(t => `<p>${esc(t)}</p>`).join("")}
        <ul class="pf-servicos">${(s.servicos || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      </div>
      <div class="pf-col pf-foto">${s.foto
        ? `<img src="${esc(s.foto)}" alt="${esc(C.marca.nome)}">`
        : flor("pf-flor-grande")}</div>`);

    /* 3. sumário */
    const sumario = pag("pf-sumario", `
      <h2 class="pf-tarja">${esc(T("pf.conteudo"))}</h2>
      <div class="pf-sum-grade c${Math.min(eixosPF.length, 4)}">${eixosPF.map((g, i) => `
        <div>
          <h3><span>${i + 1}.</span> ${esc(g.eixo.nome)}</h3>
          <ul>${g.projetos.map(p => `<li><strong>${esc(p.titulo)}</strong><span>${esc(p.cliente || "")}</span></li>`).join("")}</ul>
        </div>`).join("")}
      </div>`);

    /* 4. projetos */
    const ux = tipo === "uxui";
    function paginasProjeto(p){
      const imgs = imagensDoProjeto(p);
      const principal = p.abertura || p.capa || (imgs[0] && imgs[0].src) || "";
      const fichas = [[T("ficha.cliente"), p.cliente], [T("ficha.papelCurto"), p.papel], [T("ficha.ano"), p.ano],
        [T("ficha.duracao"), p.duracao], [T("ficha.ferramentas"), (p.ferramentas || []).join(", ")]]
        .filter(f => f[1]).map(f => `<div><span>${esc(f[0])}</span>${esc(f[1])}</div>`).join("");
      const intro = textos(p.introducao || p.descricao).filter(t => !pendente(t))[0] || "";
      const a = pag("pf-proj", `
        <div class="pf-proj-txt">
          <span class="pf-meta">${esc(eixoDe(p.eixo).nome)} · ${esc(p.ano)}</span>
          <h2 class="pf-tarja">${esc(p.titulo)}</h2>
          <p class="pf-resumo">${esc(p.resumo)}</p>
          ${intro ? `<p>${esc(intro)}</p>` : ""}
          ${(p.metricas && p.metricas.length) ? `<div class="pf-metricas">${p.metricas.map(m =>
            `<div><strong>${esc(m.valor)}</strong><span>${esc(m.rotulo)}</span></div>`).join("")}</div>` : ""}
          <div class="pf-fichas">${fichas}</div>
        </div>
        <div class="pf-proj-img">${principal
          ? `<img src="${esc(principal)}" alt="" style="object-position:${esc(p.aberturaFoco || p.capaFoco || "center")}">` : ""}</div>`);

      /* segunda página: as imagens escolhidas em imagensPdf, ou as primeiras do projeto */
      const escolha = (p.imagensPdf ? p.imagensPdf.map(normImg) : imgs.filter(i => i.src !== principal))
                      .slice(0, ux ? 2 : 4);
      const soRetrato = escolha.length && escolha.every(i => i.formato === "post" || i.formato === "retrato");
      if (!ux && soRetrato) escolha.splice(3);
      let b = "";
      if (ux) {
        const secs = (p.secoes || p.blocos || []).map(sc => ({
          titulo: sc.titulo, txt: textos(sc.texto).filter(t => !pendente(t))[0] })).filter(x => x.txt).slice(0, 4);
        if (secs.length || escolha.length) b = pag("pf-proj-b pf-ux", `
          <div class="pf-etapas">${secs.map((x, i) => `
            <div><span>${String(i + 1).padStart(2, "0")}</span><h3>${esc(x.titulo)}</h3><p>${esc(x.txt)}</p></div>`).join("")}
          </div>
          <div class="pf-ux-imgs n${escolha.length}">${escolha.map(i =>
            `<figure><img src="${esc(i.src)}" alt="${esc(i.legenda || "")}"></figure>`).join("")}</div>`);
      } else if (escolha.length >= 2) {
        const retrato = escolha.filter(i => i.formato === "post" || i.formato === "retrato").length > escolha.length / 2;
        b = pag("pf-proj-b", `
          <div class="pf-galeria ${retrato ? "fila" : "grade"} n${escolha.length}">${escolha.map(i => `
            <figure class="${i.formato === "cheia" || i.formato === "sangria" ? "inteira" : ""}">
              <img class="${i.foco ? "pf-corta" : ""}" src="${esc(i.src)}" alt="${esc(i.legenda || "")}"${i.foco ? ` style="object-position:${esc(i.foco)}"` : ""}>
              ${i.legenda ? `<figcaption>${esc(i.legenda)}</figcaption>` : ""}
            </figure>`).join("")}
          </div>`);
      }
      return a + b;
    }

    const corpo = eixosPF.map(g =>
      pag("pf-divisor", `<h2 class="pf-tarja">${esc(g.eixo.nome)}</h2>`) +
      g.projetos.map(paginasProjeto).join("")).join("");

    /* 5. contato */
    const fim = pag("pf-fim", `
      <div>
        <h2 class="pf-tarja">${esc(T("pf.fim"))}</h2>
        <p>${esc(T("pf.fimSub"))}</p>
        <ul class="pf-contatos">
          <li>${esc(c.email)}</li>
          ${c.redes.map(r => `<li>${esc(r.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""))}</li>`).join("")}
          ${c.telefone ? `<li>${esc(c.telefone)}</li>` : ""}
        </ul>
      </div>
      <div class="pf-capa-marca">${logo}</div>`);

    const botoes = Object.keys(PF).map(k =>
      `<button data-pf="${esc(k)}" aria-pressed="${k === tipo}">${esc(PF[k].titulo)}</button>`).join("");

    app.innerHTML = `
      <div class="env">
        <div class="cv-barra">
          <div class="cv-modos">${botoes}</div>
          <button class="btn btn-cheio" id="btnImprimirPf">${esc(T("cv.baixar"))}</button>
        </div>
        <p class="cv-aviso">${esc((cfg.aviso || "") + T("pf.dicaImpressao"))}</p>
      </div>
      <div class="pf-doc" id="pfDoc">${capa}${prazer}${sumario}${corpo}${fim}</div>`;

    /* Cada página é uma folha A4 fechada: se o texto passar da altura, a tipografia
       da página encolhe em passos até caber, em vez de sair cortada no PDF. */
    caberNaPagina();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(caberNaPagina);

    app.querySelector(".cv-modos").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      location.hash = "#/portfolio/" + b.dataset.pf;
    });
    document.getElementById("btnImprimirPf").addEventListener("click", async () => {
      const bt = document.getElementById("btnImprimirPf");
      bt.textContent = T("pf.preparando");
      /* espera todas as imagens carregarem, senão elas saem em branco no PDF */
      await Promise.all([...document.querySelectorAll("#pfDoc img")].map(i =>
        i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
      bt.textContent = T("cv.baixar");
      const antes = document.title;
      document.title = T("pf.arquivo") + nomePF + " - " + cfg.titulo;
      document.body.classList.add("imprimindo-pf");
      window.print();
      setTimeout(() => { document.title = antes; document.body.classList.remove("imprimindo-pf"); }, 800);
    });
  }

  /* ---- lupa: clique na imagem para ampliar ------------------------------ */
  const lupa = document.getElementById("lupa");
  const lupaImg = document.getElementById("lupaImg");
  const lupaLeg = document.getElementById("lupaLeg");
  let lista = [], atual = 0, focoAnterior = null;

  function mostrarLupa(i){
    atual = (i + lista.length) % lista.length;
    const el = lista[atual];
    lupaImg.src = el.dataset.zoom;
    lupaImg.onload = () => lupa.classList.toggle("alto", lupaImg.naturalHeight / lupaImg.naturalWidth > 2.2);
    lupaImg.alt = el.alt || "";
    lupaLeg.textContent = el.dataset.leg || "";
    lupaLeg.hidden = !el.dataset.leg;
    const varios = lista.length > 1;
    document.getElementById("lupaAnt").hidden = !varios;
    document.getElementById("lupaProx").hidden = !varios;
  }
  function abrirLupa(el){
    const grade = el.closest(".galeria");
    lista = grade ? Array.from(grade.querySelectorAll("img[data-zoom]")) : [el];
    focoAnterior = document.activeElement;
    lupa.hidden = false;
    document.body.style.overflow = "hidden";
    mostrarLupa(lista.indexOf(el));
    document.getElementById("lupaFechar").focus();
  }
  function fecharLupa(){
    lupa.hidden = true;
    lupaImg.removeAttribute("src");
    document.body.style.overflow = "";
    if (focoAnterior) focoAnterior.focus();
  }
  document.addEventListener("click", ev => {
    const alvo = ev.target.closest("img[data-zoom]");
    if (alvo) { abrirLupa(alvo); return; }
    if (ev.target === lupa) fecharLupa();
  });
  document.getElementById("lupaFechar").addEventListener("click", fecharLupa);
  document.getElementById("lupaAnt").addEventListener("click", () => mostrarLupa(atual - 1));
  document.getElementById("lupaProx").addEventListener("click", () => mostrarLupa(atual + 1));
  document.addEventListener("keydown", ev => {
    if (lupa.hidden) return;
    if (ev.key === "Escape") fecharLupa();
    if (ev.key === "ArrowLeft") mostrarLupa(atual - 1);
    if (ev.key === "ArrowRight") mostrarLupa(atual + 1);
  });

  /* ---- roteador -------------------------------------------------------- */
  const cortina = document.getElementById("cortina");
  let primeira = true;

  function desenhar(){
    const h = location.hash.replace(/^#\/?/, "");
    const partes = h.split("/");
    if (partes[0] === "projeto" && partes[1]) paginaProjeto(partes[1]);
    else if (partes[0] === "curriculo") paginaCurriculo(partes[1] || "criativo");
    else if (partes[0] === "portfolio") paginaPortfolio(partes[1] || "grafico");
    else {
      paginaInicio();
      const alvo = h.startsWith("#") ? h.slice(1) : "";
      if (alvo) { requestAnimationFrame(() => document.getElementById(alvo)?.scrollIntoView()); return; }
    }
    window.scrollTo(0,0);
  }

  function navegar(){
    if (primeira){ primeira = false; desenhar(); observar(); return; }
    const reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduz){ desenhar(); observar(); return; }
    cortina.className = "cortina entra";
    setTimeout(() => {
      desenhar(); observar();
      cortina.className = "cortina sai";
    }, 520);
  }

  /* adesivos acompanham o cursor, de leve */
  let pend = false, ex = 0, ey = 0;
  document.addEventListener("pointermove", e => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    ex = e.clientX; ey = e.clientY;
    if (pend) return;
    pend = true;
    requestAnimationFrame(() => {
      pend = false;
      const capa = document.querySelector(".capa");
      if (!capa) return;
      const r = capa.getBoundingClientRect();
      if (ey < r.top || ey > r.bottom) return;
      const nx = (ex - r.left - r.width / 2) / (r.width / 2);
      const ny = (ey - r.top - r.height / 2) / (r.height / 2);
      capa.querySelectorAll(".ades").forEach(el => {
        const d = parseFloat(el.dataset.p) || 0;
        el.style.setProperty("--px", (nx * d * 26).toFixed(1) + "px");
        el.style.setProperty("--py", (ny * d * 18).toFixed(1) + "px");
      });
    });
  }, {passive:true});

  document.getElementById("btnIdioma").addEventListener("click", trocarIdioma);
  document.getElementById("btnIdiomaMob").addEventListener("click", trocarIdioma);

  window.addEventListener("hashchange", navegar);
  if (!location.hash) location.hash = "#/";
  aplicarIdioma();
  navegar();
})();
</script>
</body>
</html>
